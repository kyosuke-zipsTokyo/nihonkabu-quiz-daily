<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年8月31日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

  </main>

</div>

<script>
const QUESTIONS = [{"cat":"直近ニュース","q":"2026年8月28日の米国市場終了後、シカゴ日経225先物の清算値は6万5780円と大阪日中終値比450円安となった。前週末の日経平均終値は6万6405円56銭。週明け8月31日の東京市場に臨む短期トレーダーの考え方として最も適切なのはどれか。","opts":["CME清算値は翌営業日の寄り付き水準の目安になるため、600円超安の水準からのスタートを想定し、寄り付き直後の値動き（そのまま下げ続けるか、寄り安から切り返すか）を確認してから方針を決める","CME清算値は東京の始値を法的に決定するため、寄り付きは必ず6万5780円ちょうどになる","CME清算値は現物株と無関係なので、週明けの東京市場を考える材料にはならない","CME清算値が安いということは、その日の日経平均が必ず安値引けすることを意味する"],"correct":0,"explain":"シカゴ日経平均先物の清算値は、米国市場での日本株評価を反映した「週明けの目安」として広く使われる。ただし目安にすぎず、寄り付き後にギャップを埋めにいく（寄り安→切り返し）ケースも多い。始値を決定するものでも、終値を保証するものでもない。ギャップダウン後の最初の30分の値動きと売買代金を確認するのが実務的。","chart":{"type":"bar","data":[{"label":"日経平均 8/28終値","value":66405.56},{"label":"CME清算値(大証比-450)","value":65780}]}},{"cat":"直近ニュース","q":"2026年8月28日の米国市場で、決済大手ペイパル・ホールディングスが大幅安となった。前日にストライプと投資ファンドのアドベント・インターナショナルによる買収が断念されたと伝わったためである。この「買収破談」局面での短期トレードの考え方として最も適切なのはどれか。","opts":["買収期待で積み上がったプレミアム分の買い持ちが解消されるため、破談報道直後は需給主導の急落になりやすく、押し目買いは需給整理の一巡（出来高減少と安値切り上げ）を待つのが基本","買収が破談になっても企業価値は変わらないので、株価はほとんど動かないのが通常である","破談報道は必ず翌日に全戻しするため、寄り付きで最大サイズの買いを入れるのが定石","破談は経営陣の交代を必ず伴うため、無条件で長期保有の好機である"],"correct":0,"explain":"買収観測で買われた銘柄は、TOB価格や思惑プレミアムを織り込んだイベント・ドリブン系の資金が入っている。破談が確定すると、この資金が一斉に手仕舞うため、ファンダメンタルズと無関係な需給主導の下落になりやすい。短期では「落ちるナイフ」を掴まず、出来高が細って安値を切り上げるまで待つのがリスク管理上妥当。","chart":{"type":"none","data":[]}},{"cat":"直近ニュース","q":"2026年8月28日の米国市場は、ダウ工業株30種平均が9.45ドル安の5万3559.99ドル、ナスダック総合が138.92ポイント安の2万6402.42と反落した。セクター別では小売が上昇する一方、半導体・半導体製造装置が下落した。この日のセクター動向から、週明けの東京市場について最も想定しやすいのはどれか。","opts":["値がさ半導体関連が指数の重荷となる一方、内需・小売など非ハイテク銘柄が相対的に堅調となり、指数の下げに対して騰落レシオや値上がり銘柄数が底堅い展開になりやすい","米国で小売が上昇したので、東京でも必ず半導体株が買われる","セクター間の強弱は日本市場には一切伝播しないため、参考にならない","半導体が下落した翌日は、東証プライムの全銘柄が下落するのが通例である"],"correct":0,"explain":"日経平均は値がさ半導体株のウエートが高いため、米半導体安は指数を押し下げやすい。一方で米国で小売など内需系が買われた場合、日本でも小売・食品・鉄道などディフェンシブ／内需系に資金が回りやすく、「指数は安いが値上がり銘柄数は多い」というねじれが起きやすい。指数だけでなく騰落状況を併せて見るのが短期売買の基本。","chart":{"type":"bar","data":[{"label":"ダウ 前日比(ドル)","value":-9.45},{"label":"ナスダック 前日比(pt)","value":-138.92},{"label":"S&P500 前日比(pt)","value":-19.23}]}},{"cat":"マクロ指標","q":"毎月初に発表される米ISM製造業景気指数について、短期トレードでの読み方として最も適切なのはどれか。","opts":["50が拡大・縮小の分かれ目で、水準そのものに加え「予想との乖離」と新規受注・雇用などの内訳が重要。ただし米GDPの大部分はサービス業なので、非製造業（サービス業）指数と併せて判断する","50を下回った瞬間に米国は必ず景気後退入りが確定するため、株は無条件で売りである","ISM製造業は速報性が低く、CPIより後に出るため相場材料にならない","ISM製造業の支払価格指数はインフレとは無関係な項目である"],"correct":0,"explain":"ISM製造業は月初に出る速報性の高い指標で、50が景況の分岐点。短期の値動きは水準よりも市場予想との差で決まりやすく、新規受注（先行性）や支払価格（インフレ）といった内訳がヒントになる。ただし米経済に占める製造業の比重は小さいため、数日後に出る非製造業指数と合わせて確認するのが実務的。","chart":{"type":"line","data":[{"label":"好況の目安","value":55},{"label":"中立（分岐点）","value":50},{"label":"不況の目安","value":45}]}},{"cat":"為替と日本株","q":"ドル円が1ドル=160円台に乗せ、政府・日銀による為替介入への警戒感が意識される局面がある。この状況での短期トレードの考え方として最も適切なのはどれか。","opts":["円安メリット銘柄の上値追いはリスク・リワードが悪化しやすい。介入が入れば数円規模の急激な円高が一気に起き、輸出株や日経レバレッジ型ETFが短時間で急落しうるため、ポジションサイズと損切り幅を通常より厳しくする","介入は事前に日時が公表されるため、その時刻だけ避ければリスクはゼロになる","介入があってもドル円は必ず1営業日で元の水準へ戻るため、無視してよい","介入警戒がある局面ほど、レバレッジを最大にして円安方向に賭けるべきである"],"correct":0,"explain":"実弾介入は予告なく行われ、瞬間的に数円動くこともある。円安メリット株を高値圏で追いかけていると、介入一発で含み益が消えるどころか損失に転じる。介入の有無は当てにいくものではなく、「起きても致命傷にならないサイズ」に落とすというリスク管理で対応するのが定石。","chart":{"type":"line","data":[{"label":"8/28ロンドン 一時","value":160.2},{"label":"NY終値","value":159.95},{"label":"8/29早朝","value":160.1}]}},{"cat":"歴史的暴落","q":"2000年からのITバブル崩壊で、米ナスダック総合指数はどのような値動きをたどったか。最も近いものはどれか。","opts":["2000年3月の約5,048をピークに2002年10月には約1,100台まで約8割下落し、ピーク水準を回復したのは約15年後の2015年だった","高値から2割ほど下げただけで、半年で最高値を更新した","ピークから約5割下落し、翌2001年中に最高値を回復した","下落は1営業日で完結し、その後は一貫した上昇相場となった"],"correct":0,"explain":"ナスダック総合は2000年3月10日に終値ベースで約5,048をつけた後、2002年10月には1,100台まで約78%下落した。前回高値を上回ったのは2015年で、実に15年を要した。「テーマ性の高いバブルは崩壊すると回復に極めて長い年月がかかる」ことを示す典型例で、押し目買いの安易な反復（ナンピン）が最も危険な局面でもある。","chart":{"type":"line","data":[{"label":"2000年3月 高値","value":5048},{"label":"2001年9月","value":1423},{"label":"2002年10月 安値","value":1114},{"label":"2015年 高値更新","value":5056}]}},{"cat":"歴史的暴落","q":"1989年末の日本のバブル相場のピークとその後について、正しい説明はどれか。","opts":["1989年12月29日の大納会で日経平均は史上最高値3万8915円87銭をつけ、その後2008年10月には6994円90銭まで下落。最高値を更新したのは34年余り後の2024年2月だった","1989年の高値は約2万円で、翌年には最高値を更新した","バブル崩壊後の安値は約2万円台で、10年以内に最高値を回復した","1989年12月の高値は3万8915円だが、1995年には最高値を更新している"],"correct":0,"explain":"日経平均は1989年12月29日に取引時間中3万8957円、終値3万8915円87銭の史上最高値をつけた。その後の長期下落でリーマン・ショック後の2008年10月28日にバブル後最安値6994円90銭を記録。最高値更新は2024年2月22日で、34年2カ月を要した。指数レベルでも「戻るのに数十年」があり得ることを示す事例。","chart":{"type":"line","data":[{"label":"1989/12 高値","value":38915},{"label":"2003/4 安値","value":7607},{"label":"2008/10 安値","value":6994},{"label":"2024/2 最高値更新","value":39098}]}},{"cat":"歴史的暴落","q":"2008年のリーマン・ショック局面における米国株の値動きとして、最も正しいのはどれか。","opts":["ダウ平均は2007年10月の約1万4164ドルをピークに、2009年3月9日の約6547ドルまで約54%下落し、下落局面では一時的な大幅反発（ベアマーケット・ラリー）を何度も挟んだ","破綻報道の当日に底を打ち、翌週から一貫した上昇に転じた","下落率は1割程度にとどまり、短期の調整で終わった","下落局面では一度も反発局面がなく、毎日下げ続けた"],"correct":0,"explain":"ダウは2007年10月の史上最高値約1万4164ドルから、2009年3月9日の約6547ドルまで約54%下落した。特徴的なのは、下落途中に何度も1割超の急反発（ベアマーケット・ラリー）を挟んだこと。弱気相場では戻りが鋭いため「底打ち」と誤認しやすく、短期では戻り売り優位の姿勢とトレンド確認が重要になる。","chart":{"type":"line","data":[{"label":"2007/10 高値","value":14164},{"label":"2008/9 リーマン破綻時","value":11400},{"label":"2008/11 安値","value":7552},{"label":"2009/3 大底","value":6547}]}},{"cat":"伝説のトレーダー","q":"ソロスのクォンタム・ファンドを運用し、後にデュケイン・キャピタルを率いたスタンレー・ドラッケンミラーの相場観として、最も適切なのはどれか。","opts":["勝率よりも「確信度が高い局面で徹底的に大きく張ること（ホームランを狙う集中投下）」を重視し、間違いに気づけば躊躇なく手仕舞うことを信条とした","分散こそが最重要であり、常に数百銘柄へ均等に資金を配分することを説いた","ファンダメンタルズは無意味であり、直感だけで売買することを推奨した","一度建てたポジションは損益にかかわらず決して変更しないことを原則とした"],"correct":0,"explain":"ドラッケンミラーは「たくさん勝つことではなく、正しいときにどれだけ大きく取れるかが重要」という趣旨を繰り返し語ってきた。確信の高い場面で集中的にリスクを取り、想定が崩れたら素早く撤退する。分散を否定してはいないが、「確信度に応じたポジションサイズの傾斜配分」が中核である点が特徴。","chart":{"type":"none","data":[]}},{"cat":"伝説のトレーダー","q":"短期売買の名手として『新マーケットの魔術師』などで知られるリンダ・ブラッドフォード・ラシュキの手法の中核として、最も適切なのはどれか。","opts":["ボラティリティの収縮（保ち合い）から拡大への転換や、行き過ぎた値動き後の平均回帰を、明確なパターンとルールに落として短期で繰り返し執行する","四半期決算だけを根拠に数年単位で保有し続けるバイ・アンド・ホールドを推奨した","損切りは置かず、含み損は必ずナンピンで平均取得単価を下げる手法を説いた","ニュースを一切見ず、乱数でエントリー方向を決めることを推奨した"],"correct":0,"explain":"ラシュキは短期のパターン売買を体系化したことで知られ、値幅・ボラティリティの収縮後の放れ、行き過ぎ後の戻りなどを繰り返し検証可能なルールとして扱った。重要なのは「予測」より「反復可能な執行と厳格なリスク管理」であり、ナンピンや無制限保有は真逆の発想である。","chart":{"type":"none","data":[]}}];

const MARKET = {"nikkei225":"66,405.56円","nikkei225Change":"+273.58 (+0.41%)","nikkeiLeverage":"69,780円","nikkeiLeverageChange":"+530 (+0.77%)","usdJpy":"160.09〜160.11円","usdJpyChange":"+0.74 (+0.46%)","asOf":"2026年8月31日 早朝（日本時間）時点。日経平均・日経レバレッジ上場投信(1570)は前営業日（8月28日）の終値。ドル円は8月29日早朝のニューヨーク市場終盤の水準。参考：8月28日の米国市場はダウ53,559.99ドル（-9.45）、ナスダック26,402.42（-138.92）、シカゴ日経225先物清算値は大証比450円安の65,780円。"};

let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
