<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年8月28日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

<script>
const QUESTIONS = [{"cat":"直近ニュース（米国市場）","q":"2026年8月27日（現地）の米国市場でダウ工業株30種平均は前日比105ドル56セント高の5万3569ドル44セントと反発した。エヌビディアは一時10%近く上昇した一方、AMDなど一部半導体株は上値が重かった。この日の値動きの説明として最も適切なのはどれか。","opts":["エヌビディアの好決算・強気ガイダンスがAI需要の強さを再確認させた一方、政権が半導体・電子機器への追加関税を検討していると報じられ、関連銘柄の重荷になった","FRBが緊急利下げに踏み切ったため、金融株主導で全面高となった","米雇用統計が大幅に悪化し、景気後退懸念からディフェンシブ株だけが買われた","原油価格の暴落でエネルギー株が急騰し、指数を押し上げた"],"correct":0,"explain":"27日はエヌビディアの5〜7月期決算と次期見通しが市場予想を上回り、AIインフラ需要への期待から同社株が一時10%近く上昇。セールスフォースの上方修正も支援材料でした。一方、半導体・電子機器への追加関税検討が報じられ、AMDなど一部は売られる「まだら模様」の物色となり、ダウの上げ幅も0.19%と限定的でした。好材料と政策リスクが同時に効いた日は、指数より個別の明暗に注目するのが短期トレードの基本です。","chart":{"type":"bar","data":[{"label":"NYダウ 8/26終値","value":53463.88},{"label":"NYダウ 8/27終値","value":53569.44}]}},{"cat":"直近ニュース（東京市場）","q":"2026年8月27日の東京株式市場で日経平均は3日ぶりに反落し、終値は前日比130円18銭安（-0.20%）の6万6131円98銭だった。値がさの半導体関連1銘柄だけで日経平均を約260円押し下げたと報じられた。この事実から読み取れることとして最も適切なのはどれか。","opts":["日経平均は株価水準の高い値がさ株の影響が大きく、指数の下げ幅と市場全体の地合いが乖離することがある","日経平均は時価総額加重平均なので、1銘柄が指数を大きく動かすことはない","1銘柄で260円動かせるのは指数の計算ミスであり、通常は起こらない","日経平均が下げた以上、東証プライムの値下がり銘柄数が必ず値上がり銘柄数を上回っている"],"correct":0,"explain":"日経平均は株価平均型（除数調整あり）の指数で、値がさ株のウエートが極端に大きくなります。半導体検査装置などの高株価銘柄が1社で200〜300円押し下げることは珍しくありません。したがって指数の下落＝全体安とは限らず、TOPIXや騰落銘柄数、業種別騰落と併せて地合いを判断する必要があります。","chart":{"type":"line","data":[{"label":"8/25終値","value":65856.43},{"label":"8/26終値","value":66262.16},{"label":"8/27終値","value":66131.98}]}},{"cat":"イベントリスク","q":"日本時間8月28日夜、ジャクソンホール会議でウォーシュFRB議長が就任後初めて講演する。同議長は将来の政策運営を細かく示す「フォワードガイダンス」に否定的とされる。この状況下の短期トレードの考え方として最も適切なのはどれか。","opts":["ガイダンスを出さない姿勢は市場の織り込みを不安定にしやすく、講演中の値動きは往復のブレが大きくなりやすいので、ポジション量を抑え、初動の一方向決め打ちを避ける","ガイダンスを出さない議長の講演は材料にならないので、無視して通常どおりフルポジションで臨めばよい","講演前に必ず株は下がるので、前日引けで全力の売り建てが有利","講演内容は事前にリークされるのが通例なので、前日の値動きの方向にそのまま追随すればよい"],"correct":0,"explain":"先行き指針を出さないスタンスは、市場が金利パスを自力で推測する必要を生み、一言の解釈で価格が振れやすくなります。実際、直近のFOMC後会見でも債券市場が大きく反応しました。イベント時は「方向」より「変動幅」が上がるため、ロットを落とす・初動を追わない・往復（フェイクムーブ）を前提に置くのが定石です。","chart":{"type":"none","data":[]}},{"cat":"為替と株","q":"円安が進むと日経平均が上がりやすいとされる主因の説明として、最も適切なのはどれか。","opts":["主要輸出企業の想定為替レートより円安になると、円換算の海外売上・営業利益が上振れし、market全体のEPS見通しが切り上がるため","円安になると日銀が必ず株を買い入れる制度があるため","円安は輸入物価を下げ、内需企業の原価が下がるため","円安時は海外投資家が円資産を売却するため、需給が引き締まるため"],"correct":0,"explain":"日本の主要企業は期初に想定為替レート（例：1ドル=145〜150円など）を置いており、実勢がそれより円安になると海外利益の円換算額が増え、通期の上方修正期待が高まります。一般に1円の円安は大手輸出企業の経常利益を数百億円規模で押し上げるとされ、指数EPSの押し上げを通じて株価の支えになります。ただし原材料を輸入する内需企業にはマイナスで、円安は「セクター間の資金移動」を伴う点に注意が必要です。","chart":{"type":"bar","data":[{"label":"7月末 ドル円","value":163},{"label":"介入後安値","value":155.3},{"label":"8/28早朝 ドル円","value":159.35}]}},{"cat":"マクロ指標","q":"米CPI（消費者物価指数）を短期トレードで読む際、住居費（シェルター）に注目すべき理由として最も適切なのはどれか。","opts":["CPI全体のウエートが約3分の1と最大で、実勢家賃に対して遅行するため、シェルター次第で総合・コアの数値が数カ月にわたり押し上げ／押し下げられるから","シェルターはCPIに含まれないため、除外して考える必要があるから","シェルターは毎月必ず前月比0%で固定されているから","シェルターはFRBが直接コントロールできる唯一の項目だから"],"correct":0,"explain":"米CPIでシェルターは全体の約3割強を占める最大項目で、しかも新規契約家賃の動きが遅れて反映されます。そのため市場は「シェルターを除くコアサービス」など内訳で基調を判断します。ヘッドラインが強くてもシェルター主導なら金利上昇は限定的、逆にサービス全般が強ければ利上げ観測が高まる、という切り分けが短期の反応を読むうえで有効です。","chart":{"type":"bar","data":[{"label":"シェルター（概算ウエート%）","value":35},{"label":"食品","value":13},{"label":"エネルギー","value":7},{"label":"その他コア財・サービス","value":45}]}},{"cat":"歴史（暴落）","q":"1998年10月、ヘッジファンドLTCM破綻をきっかけに為替市場で起きた出来事として正しいのはどれか。","opts":["円キャリー取引の急激な巻き戻しでドル円が数日で20円規模の円高となり、株式市場もリスク回避で急落した","ドル円が数日で20円の円安となり、輸出株が急騰した","為替はほとんど動かず、影響は米国債市場だけにとどまった","日銀が大規模なドル売り介入を行い、意図的に円高を演出した"],"correct":0,"explain":"1998年秋のLTCM危機では、レバレッジ解消と低金利の円を売って高利回り資産を買う「円キャリー」の巻き戻しが同時に起き、ドル円は10月上旬の数日間で20円規模の急激な円高となりました。ポジション偏在の解消は、ファンダメンタルズと無関係に一方向へ走るのが特徴で、2024年8月の円急騰局面と同じ構造です。短期トレードでは「需給の偏り＝逆流時の破壊力」と覚えておくべき事例です。","chart":{"type":"none","data":[]}},{"cat":"歴史（急落）","q":"2018年2月5日のいわゆる「VIXショック」について正しい説明はどれか。","opts":["NYダウが1,175ドル安（-4.6%）と当時の史上最大の下げ幅を記録し、VIXが1日で倍以上に急騰、翌6日の日経平均も1,000円を超える下落となった","VIXが1日で半分以下に低下し、株式は急騰した","米国の金融機関が連鎖破綻したことが原因で、下落は1年以上続いた","日本発の材料であり、米国市場はほとんど反応しなかった"],"correct":0,"explain":"2018年2月5日、賃金上昇率の上振れをきっかけとした金利上昇に、低ボラティリティを前提とした「VIX売り」商品の強制的な巻き戻しが重なり、ダウは1,175ドル安、VIXは17前後から37台へ急騰しました。翌6日の日経平均も1,071円安（-4.7%）と急落。ただし景気後退を伴わ   const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
