<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年8月24日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

<script>
const QUESTIONS = [{"cat":"直近ニュース","q":"2026年8月21日（現地）の米国市場では主要3指数が反発し、NYダウは前日比517.80ドル高（+0.98%）の53,277.01ドル、S&P500は+0.43%となった一方、エヌビディアなど半導体株は軟調だった。この日の物色の説明として最も適切なのはどれか。","opts":["エヌビディア決算とジャクソンホールという大型イベントを控え、半導体は利益確定・様子見となる一方、前週の下げに対する買い戻しが金融・景気敏感株やテスラに向かった","半導体の減益決算が出そろい、業績悪化を織り込む売りが半導体セクター全体に広がった","米長期金利が急低下したため、金利敏感の高PER株だけが選好され、金融株は売られた","原油価格が暴落し、エネルギー関連の売りが指数全体を押し下げた"],"correct":0,"explain":"報道によれば21日はダウ・S&P500がそろって上昇したものの、上げを主導したのはゴールドマン・サックスなど金融株やテスラ（+5.14%）といった景気敏感・バリュー色の強い銘柄でした。半導体はエヌビディア（-0.98%）、マイクロン（-0.77%）、インテル（-2.24%）などが下落。翌週にエヌビディア決算とジャクソンホール会議を控え、直前に持ち高を軽くする動きが出やすいのが典型で、『指数は上がっても主役は交代している』点を見抜けるかが短期トレードの分かれ目です。","chart":{"type":"bar","data":[{"label":"NYダウ(%)","value":0.98},{"label":"S&P500(%)","value":0.43},{"label":"テスラ(%)","value":5.14},{"label":"エヌビディア(%)","value":-0.98},{"label":"インテル(%)","value":-2.24}]}},{"cat":"直近ニュース","q":"米国市場ではNYダウが8月20日に703ドル安の52,759ドルと急落した後、21日は517.80ドル高の53,277.01ドルへ反発したが、週間ベースでは3指数ともマイナスだった。この『大幅安の翌日の大幅高』を短中期トレードで評価する際の考え方として最も適切なのはどれか。","opts":["週足がマイナスで戻りが下落幅の一部にとどまるうちは、トレンド転換ではなく値ごろ感による自律反発（リバウンド）の可能性を優先して考える","1日で500ドル以上戻したのだから、下落トレンドは終了したと確定的に判断できる","前日比プラスで引けた時点で、翌日も必ず上昇するアノマリーが働く","週間マイナスであっても月間でプラスなら、下落は完全に無効化される"],"correct":0,"explain":"20日の-703ドルに対し21日の戻りは+517ドルで、下落分を取り戻せていません。週間でも3指数がマイナス（S&P500・ナスダックは3週続伸が止まり、ダウは2週続落）で、金利や中東情勢の不透明感も残ったままです。安値からの初動の戻りは『ショートカバー＋値ごろ買い』であることが多く、前回高値の奪回や出来高を伴う続伸が確認できるまではリバウンド狙いの短期戦に徹するのがセオリーです。","chart":{"type":"bar","data":[{"label":"8/20 ダウ(ドル)","value":-703},{"label":"8/21 ダウ(ドル)","value":518}]}},{"cat":"為替・マクロ","q":"2026年8月のドル円は、7月末の163円台から日米の協調介入を挟んで一時155円前半まで急落し、その後は158〜161円のレンジで推移している。この『介入警戒下の円安局面』における短中期トレードの注意点として最も適切なのはどれか。","opts":["円安メリット株を高値追いすると、介入による数円規模の急激な円高でギャップ的に含み損を抱えるリスクがあるため、建玉は小さめにし損切り水準を明確にする","介入は必ず失敗するので、円安トレンドに全力で乗るのが最も合理的である","介入が実施された日は日本株の売買が停止されるため、ポジション調整は不要である","為替が動いても輸出企業の株価には影響しないので、ドル円は無視してよい"],"correct":0,"explain":"7月30日の円買い介入、8月上旬の日米協調介入では、ドル円が163円台から155円前半まで短期間で大きく振れました。為替介入はタイミングが読めず、しかも値幅が大きいため、円安を前提に積み上げた自動車・機械などの輸出株や日経平均の買い持ちが一気に逆風を受けます。介入警戒ゾーンでは『ポジションサイズを落とす・逆指値を置く』というリスク管理が最優先になります。","chart":{"type":"bar","data":[{"label":"7月末 ドル円","value":163.6},{"label":"8/3 安値圏","value":155.3},{"label":"8月下旬 想定下限","value":158.2},{"label":"8月下旬 想定上限","value":160.8}]}},{"cat":"為替・マクロ","q":"今週（8月24日週）は26日に米PCEデフレーター、米GDP改定値、28日に東京都区部CPIの発表が控えている。米PCEが市場予想を上振れした直後に最も起こりやすい短期反応の組み合わせはどれか。","opts":["米長期金利上昇→ドル高・円安（160〜161円方向）→日本株では高PERのグロース株が売られ、銀行株は相対的に堅調","米長期金利低下→円高→グロース株が急騰し、銀行株が急落","為替も金利も反応せず、日本株だけが一方的に上昇","原油と金だけが動き、株式・債券・為替は無反応"],"correct":0,"explain":"PCEデフレーターはFRBが重視するインフレ指標で、上振れは追加利上げ・引き締め長期化観測につながります。→米金利上昇→日米金利差拡大でドル高円安、株式では割引率上昇が効く高PERグロースが売られ、利ざや改善期待の銀行など金融株は相対的に強くなりやすい、というのが教科書的な連鎖です。逆に鈍化なら金利低下・円高方向で、157〜158円台への調整シナリオが意識されます。","chart":{"type":"bar","data":[{"label":"上振れ時 想定ドル円","value":160.5},{"label":"下振れ時 想定ドル円","value":157.5}]}},{"cat":"需給・指数の見方","q":"8月21日の東京市場では日経平均が66,016円台、TOPIXが4,050ポイント前後で、日経平均だけが弱含んだ。このときの『NT倍率（日経平均÷TOPIX）』の見方として最も適切なのはどれか。","opts":["NT倍率の低下は値がさハイテク主導からバリュー・内需主導への物色シフトを示唆し、日経平均連動のレバレッジ商品より個別バリュー株が有利になりやすい","NT倍率は日経平均の予想PERを表し、上昇すれば割安を意味する","NT倍率は為替レートで決まる指標であり、株式の物色動向とは無関係である","NT倍率が低下している間は、必ずTOPIXも下落している"],"correct":0,"explain":"NT倍率は日経平均をTOPIXで割った比率で、この日はおよそ16.3倍前後。日経平均はファーストリテイリングや半導体など値がさ株の影響が大きく、TOPIXは時価総額加重で銀行・商社・自動車などの比重が高いのが特徴です。NT倍率が下がる＝値がさグロースが売られバリュー・内需が買われている局面であり、日経平均連動のレバレッジ型商品を持つと『相場は悪くないのに負ける』ことになります。","chart":{"type":"bar","data":[{"label":"日経平均 前日比(%)","value":-0.3},{"label":"TOPIX 前日比(%)","value":0.15}]}},{"cat":"歴史（暴落）","q":"1987年10月19日のブラックマンデーでNYダウは1日で約-22.6%と史上最大の下落率を記録した。翌20日の東京市場と、その後の日経平均の値動きについて正しいのはどれか。","opts":["日経平均は1日で約-14.9%（3,836円安）と暴落したが、その後は比較的短期間で回復し、翌1988年には上昇基調に復帰した","日経平均は下落せず、逆にストップ高水準まで急騰した","日経平均は約-30%下落し、回復までに10年以上を要した","東京市場は1週間にわたり売買停止となった"],"correct":0,"explain":"1987年10月20日の日経平均は3,836円安の21,910円、下落率は約-14.9%と当時としては記録的でした。しかし日本は当時、金融緩和と国内景気拡大が続いていたため戻りが速く、年内にかなりの部分を回復、1988年には上昇トレンドへ復帰しています。『同じ暴落でも、その後の金融環境（緩和か引き締めか）で回復速度がまるで違う』という点が短中期トレードの重要な教訓です。","chart":{"type":"bar","data":[{"label":"NYダウ 10/19(%)","value":-22.6},{"label":"日経平均 10/20(%)","value":-14.9}]}},{"cat":"歴史（暴落）","q":"2020年のコロナショックで、日経平均は1月の高値24,000円台から3月19日の16,552円まで急落した。この局面の下落率と、その後の値動きの組み合わせとして最も適切なのはどれか。","opts":["高値から約3割の下落だったが、各国の大規模な金融緩和・財政出動を背景に急速に戻し、同年末には27,000円台と暴落前の水準を上回った","高値から約7割下落し、暴落前の水準回復には5年以上かかった","下落率は1割程度にとどまり、その後も横ばいが続いた","下落後は一段安が続き、2020年末は12,000円台だった"],"correct":0,"explain":"2020年1月の高値24,083円から3月19日の安値16,552円まで、下落率はおよそ31%。しかしFRBの無制限緩和や各国の巨額財政出動を受けてV字回復し、同年12月末は27,444円と暴落前を上回りました。『政策対応が早く強い暴落は戻りも速い（流動性ショック型）』であり、金融引き締めが原因の下落（バリュエーション調整型）とは戻りの性質が異なります。","chart":{"type":"line","data":[{"label":"2020/1 高値","value":24083},{"label":"2020/3/19 安値","value":16552},{"label":"2020/12 末","value":27444}]}},{"cat":"歴史（暴落）","q":"2024年8月5日、日経平均は4,451円安（-12.4%）の31,458円と史上最大の下げ幅を記録した（いわゆる令和のブラックマンデー）。翌8月6日の値動きとして正しいのはどれか。","opts":["3,217円高（+10.2%）の34,675円と、史上最大の上げ幅で急反発した","さらに2,000円超下落し、連日の暴落となった","売買停止措置がとられ、取引が行われなかった","ほぼ横ばい（前日比±50円以内）で膠着した"],"correct":0,"explain":"2024年8月5日は日銀の利上げ後の急速な円高と米景気懸念、円キャリー取引の巻き戻しが重なり-12.4%。翌6日は3,217円高（+10.2%）と史上最大の上げ幅で反発しました。パニック的な投げ売りとロスカットで需給が一気に軽くなった後は、ボラティリティが極端に高い状態でV字反発が起きやすいという典型例で、短期トレードでは『暴落翌日の寄り付き』の扱いがリスクとリターン双方の宝庫になります。","chart":{"type":"bar","data":[{"label":"2024/8/5(円)","value":-4451},{"label":"2024/8/6(円)","value":3217}]}},{"cat":"伝説のトレーダー","q":"『欲望と幻想の市場』で知られるジェシー・リバモアの手法・相場観の中核として、最も適切なものはどれか。","opts":["主導株の『ピボタルポイント（転換点）』のブレイクを待って順張りで乗り、含み損の建玉にナンピンせず速やかに損切りする","下げた銘柄ほど割安なので、下落するたびに買い増して平均取得単価を下げる","相場は常に効率的なので、売買タイミングを計らず常時フルポジションを維持する","決算の数字だけを根拠に、値動きは一切見ずに長期保有する"],"correct":0,"explain":"リバモアは『相場の主導セクター・主導株を見極め、決定的な転換点（ピボタルポイント）を抜けたところに乗る』こと、そして『損失は小さく、利は伸ばす』『負けている建玉にナンピンしない』ことを繰り返し説きました。待つことの重要性（座って待つのが金を生む）も有名で、短中期トレードのブレイクアウト戦略とリスク管理の原型といえます。","chart":{"type":"none","data":[]}},{"cat":"伝説のトレーダー","q":"ブリッジウォーターを創業したレイ・ダリオが『投資の聖杯（Holy Grail）』と呼んだ考え方として最も適切なものはどれか。","opts":["相関の低い収益源を15前後に分散すれば、期待リターンを落とさずにリスク（変動率）を大幅に下げられる","1銘柄に資金を集中させ、レバレッジを最大化するのが最も効率的である","過去に最も上昇した資産だけを買い続ければリスクは自然に消える","経済予測は不可能なので、リスク管理も分散も意味がない"],"correct":0,"explain":"ダリオは、期待リターンが同等でも互 let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
