<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年8月23日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

<script>
const QUESTIONS = [{"cat":"マクロ指標","q":"米財務省が10年・20年・30年債の買い戻し（バイバック）規模を従来の2倍以上に拡大すると発表した。この発表直後に、短期トレードで最も想定しやすい反応の組み合わせはどれか。","opts":["長期金利が低下しやすく、金利上昇に弱かったグロース株・不動産株が買い戻されやすい","長期金利が急上昇し、ハイテク株が真っ先に売られる","為替は必ず円高に振れ、輸出株が急落する","国債需給とは無関係のため株式市場は一切反応しない"],"correct":0,"explain":"当局が長期債を買い戻すことは国債の需給改善（需要増）を意味し、まず長期金利の低下要因となります。長期金利の低下は割引率の低下を通じて将来利益の比重が大きいグロース株や、資金調達コストの影響を受けやすい不動産・REITなどに追い風です。ただし買い戻し規模が限定的だと金利上昇トレンド自体は止まらず、反応が一時的に終わることも多く、短期トレードでは『初動の買い→戻り売り』への切り替えが速い点に注意が必要です。","chart":{"type":"bar","data":[{"label":"NYダウ 8/21騰落率(%)","value":0.98},{"label":"S&P500 8/21騰落率(%)","value":0.43},{"label":"ナスダック 8/21騰落率(%)","value":0.43}]}},{"cat":"直近ニュース","q":"2026年8月20日（現地）の米国市場でNYダウは703ドル安の52,759ドルと大幅反落したが、翌21日は約1%高と反発した。20日の急落材料として報じられた組み合わせとして最も適切なのはどれか。","opts":["米中の通商合意進展と原油急落","米・イラン間の緊張の高まりと、ウォルマート決算を受けた個人消費への警戒、長期金利の上昇","FRBによる緊急利上げの発表","主要ハイテク企業の大型M&A破談"],"correct":1,"explain":"20日は米・イラン間の地政学的緊張が意識されたうえ、ウォルマートが四半期決算で市場予想に届かず株価が大幅安となり、米個人消費の減速懸念が広がりました。加えて米長期金利の上昇が株式のバリュエーションを圧迫し、主要3指数がそろって下落しました。翌21日は金利がひとまず落ち着いたことで反発しましたが、週間では主要指数そろって下落しています。短期トレードでは『地政学＋金利＋個別決算』が重なった下げは戻りも早い一方、材料が残るとレンジ化しやすい点を意識します。","chart":{"type":"line","data":[{"label":"NYダウ 8/20終値","value":52759.21},{"label":"NYダウ 8/21終値","value":53108.93}]}},{"cat":"直近ニュース","q":"2026年8月21日の東京株式市場で日経平均は66,016円36銭（前日比-200円43銭、-0.30%）と反落した一方、TOPIXは小幅続伸した。この『日経平均だけが弱い』展開の説明として最も適切なのはどれか。","opts":["東証プライムの大半の銘柄が下落したため","ファーストリテイリングなど値がさの消費関連株が米ウォルマート急落の余波で売られ、指数寄与度の大きい銘柄主導で下げたため","為替が急激な円高となり輸出株が全面安になったため","日銀が利上げを決定したため"],"correct":1,"explain":"日経平均は株価水準の高い『値がさ株』の影響を強く受ける株価平均型指数です。この日は米ウォルマートの決算を嫌気した消費関連株安が波及し、ファーストリテイリングなど指数寄与度の大きい銘柄が下げたことで日経平均が押し下げられました。一方でプライム市場の5割強の銘柄は上昇し、時価総額加重のTOPIXは小幅続伸。短期トレードでは、日経平均の下げ＝地合い全面安とは限らず、TOPIXや騰落銘柄数との乖離を確認することが重要です。","chart":{"type":"line","data":[{"label":"8/17","value":69220.25},{"label":"8/18","value":67460.73},{"label":"8/19","value":65326.42},{"label":"8/20","value":66216.79},{"label":"8/21","value":66016.36}]}},{"cat":"イベント対応","q":"来週の市場では、水曜に米PCE物価指数とエヌビディア決算、木曜からジャクソンホール会議（議長講演は金曜）が控えている。こうした『大型イベント週』の短中期トレードの一般的な考え方として最も適切なのはどれか。","opts":["イベント前はポジションを最大化し、結果発表後に判断する","イベント前は建玉を軽くし、想定レンジと損切り水準をあらかじめ決めて、結果後の初動よりも『初動の巻き戻し』も想定して臨む","イベントは織り込み済みなので値動きは小さく、注意は不要","決算とマクロイベントが重なる週は必ず株価が上昇する"],"correct":1,"explain":"AI相場の中心銘柄の決算と、金融政策の方向性を左右する会議・物価指標が重なる週は、ボラティリティが平時より大きく拡大しやすくなります。方向性の予測精度は上がらない一方でリスク量だけが増えるため、実務的にはイベント前のポジション圧縮、明確な損切り価格の設定、そして『発表直後の初動が数十分〜翌日に逆流する』ケースへの備えが基本です。指数先物やレバレッジETFのようにボラティリティが増幅される商品は特に注意が必要です。","chart":{"type":"none","data":[]}},{"cat":"マクロ指標","q":"米新規失業保険申請件数（Initial Jobless Claims）について、短期トレードで押さえるべき説明として最も適切なのはどれか。","opts":["毎月第1金曜に発表される月次指標である","毎週木曜（日本時間では夜）に発表される週次の高頻度指標で、雇用の変調をいち早く捉えられるが単週のブレが大きいため4週移動平均も併せて見る","四半期に一度しか発表されない","失業率そのものを直接示す指標である"],"correct":1,"explain":"新規失業保険申請件数は米国で毎週木曜に発表される数少ない週次の雇用指標で、雇用統計（月次）より速報性が高いのが特徴です。ただし祝日や季節調整、州単位の特殊要因で単週の振れが大きいため、市場は4週移動平均でトレンドを確認します。申請件数が予想以上に増えると景気減速懸念で金利低下・景気敏感株安になりやすい一方、利下げ期待が強い局面では株高につながることもあり、その時々の『市場のテーマ』で反応が反転する点が短期トレードの難所です。","chart":{"type":"none","data":[]}},{"cat":"歴史的急落","q":"2011年3月11日の東日本大震災の直後、東京市場で起きた値動きとして正しいものはどれか。","opts":["翌週明け14日は約-6%、15日は約-10.5%と連日で急落し、16日には大幅反発した","震災の影響は限定的で日経平均はほぼ横ばいだった","下落は15日の1日だけで、翌日以降も下げ続けた","日経平均は震災直後に上昇し、そのまま最高値を更新した"],"correct":0,"explain":"震災翌営業日の3月14日に日経平均は約6.2%安、原発事故への懸念が高まった15日は約10.5%安と暴落し、2日間で2割近く下げました。しかし翌16日には約5.7%高と急反発しています。パニック的な投げ売りで極端に短期間・大幅に下げた相場は、需給の悪化が一巡すると自律反発が出やすいという典型例です。短期トレードでは『下落の速度と幅』『恐怖指数の急騰』が反発の目安になりますが、二番底のリスクもあるため打診買い＋分割が基本になります。","chart":{"type":"bar","data":[{"label":"2011/3/14 騰落率(%)","value":-6.18},{"label":"2011/3/15 騰落率(%)","value":-10.55},{"label":"2011/3/16 騰落率(%)","value":5.68}]}},{"cat":"歴史的急騰","q":"2016年11月9日、米大統領選でトランプ氏の当選が伝わった日の日経平均は919円安（-5.4%）と急落したが、翌10日の値動きはどうだったか。","opts":["さらに1,000円超下落し、下落が続いた","1,092円高（+6.7%）と急反発し、その後『トランプラリー』で円安・株高が進んだ","ほぼ横ばいで動かなかった","取引が終日停止された"],"correct":1,"explain":"開票中はサプライズによるリスク回避で急落しましたが、翌10日には市場が『減税・インフラ投資による景気拡大』という政策期待に評価を切り替え、日経平均は1,092円高（+6.7%）と急反発しました。以後は円安とともに『トランプラリー』が続きます。政治イベントでは、初動の値動きが数時間〜1日で完全に逆転することが珍しくなく、短期トレードでは『初動に飛び乗らず、方向が定まってから追随する』方が期待値が高い局面が多いという教訓を残しました。","chart":{"type":"bar","data":[{"label":"2016/11/9 前日比(円)","value":-919.84},{"label":"2016/11/10 前日比(円)","value":1092.88}]}},{"cat":"伝説のトレーダー","q":"『私は株で200万ドル儲けた』で知られるニコラス・ダーバスが体系化した「ボックス理論」の中核として最も適切なものはどれか。","opts":["株価が一定の値幅（ボックス）で推移した後、上限を出来高を伴って上抜けたところを買い、直近ボックス下限割れで損切りする","決算内容だけを見て割安株を長期保有する","下落した銘柄をナンピンして平均取得単価を下げ続ける","配当利回りが高い順に機械的に買う"],"correct":0,"explain":"ダーバスは株価が一定のレンジ（ボックス）を形成し、それを上放れる動きに乗る手法を確立しました。買いは出来高増を伴うボックス上限のブレイクアウト、損切りはブレイク後に築いた新しいボックスの下限割れという明確なルールで、含み損を小さく限定しつつ上昇トレンドに乗り続ける点が特徴です。ダーバスは電報で株価だけを確認して売買しており、ノイズとなる情報を遮断して価格と出来高に集中したことでも知られます。","chart":{"type":"none","data":[]}},{"cat":"伝説のトレーダー","q":"ルネサンス・テクノロジーズを率いた数学者ジム・シモンズの運用スタイルとして最も適切なものはどれか。","opts":["経営者への直接取材を重視し、割安な優良企業を長期保有した","膨大なデータから統計的な優位性（アノマリー）を見つけ、機械的・高頻度に多数の小さな取引を積み上げた","1銘柄に資産の大半を集中させ、下がっても信念で持ち続けた","もっぱらニュースの見出しを読んで裁量で売買した"],"correct":1,"explain":"シモンズは数学者・暗号解読者出身で、企業のファンダメンタルズに関する裁量判断を排し、価格データの統計的パターンをモデル化して大量の小さなトレードを高速に繰り返す定量運用を確立しました。旗艦のメダリオン・ファンドは手数料控除前で年率60%台という驚異的な成績を残したとされます。個々の勝率は50%台でも、取引回数を積み上げれば期待値が実現するという『大数の法則』の考え方は、短期トレードにおける再現性・検証の重要性を示しています。","chart":{"type":"bar","data":[{"label":"メダリオン 年率(手数料控除前,概算%)","value":66},{"label":"メダリオン 年率(控除後,概算%)","value":39},{"label":"S&P500 長期平均(概算%)","value":10}]}},{"cat":"テクニカル指標","q":"東証プライムの値上がり・値下がり銘柄数から算出する「騰落レシオ（25日）」について、短期トレードでの一般的な目安として最も適切なものはどれか。","opts":["120〜140を超えると過熱（買われすぎ）、70〜80を下回ると売られすぎと判断されやすい","常に100を超えていれば買い、下回れば売りと判断する","企業の利益成長率を示す指標である","日経平均の予想PERを算出するための指標である"],"correct":0,"explain":"騰落レシオ（25日）は、25日間の値上がり銘柄数合計÷値下がり銘柄数合計×100で計算する市場全体の需給・センチメント指標です。100が中立、一般に120〜140超で過熱＝短期的な調整に注意、70〜80割れで売られすぎ＝自律反発を意識する目安とされます。ただし強いトレンド相場では過熱圏に張り付いたまま上昇が続くこともあるため、単独で逆張り根拠にせず、指数の位置や出来高、VIXなど他指標と組み合わせて使うのが実務的です。","chart":{"type":"bar","data":[{"label":"過熱の目安","value":120},{"label":"中立","value":100},{"label":"売られすぎの目安","value":70}]}}];

const MARKET = {"nikkei225":"66,016.36円","nikkei225Change":"-200.43 (-0.30%)","nikkeiLeverage":"約68,200円（8月21日取引時間中に確認した水準）","nikkeiLeverageChange":"-1,310 (-1.88%)（8月21日午前の時点、前日終値69,510円比。確定終値は要確認）","usdJpy":"158.96円","usdJpyChange":"+0.52 (+0.32%)（8月22日5:49時点）","asOf":"2026年8月22日 早朝（日本時間）時点。日経平均・日経レバレッジ上場投信（1570）は前営業日である8月21日（金）の値で、1570は取引時間中に取得した参考値のため確定終値と異なる可能性があります。ドル円は8月22日早朝のレートです。"};

let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
