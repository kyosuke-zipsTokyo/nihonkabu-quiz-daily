<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年8月27日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

const QUESTIONS = [{"cat":"マクロ指標","q":"2026年8月26日に発表された米7月コアPCE価格指数は前月比+0.2%、前年比+3.3%と市場予想通りだった。この「予想通り」の結果を受けた短期トレードの一般的な考え方として最も適切なのはどれか。","opts":["予想通りの結果は新たな金利織り込みの変化を生みにくく、イベント通過による不確実性の解消（ボラティリティ低下）が株価の支えになりやすい","予想通りの結果は必ず株価急騰につながるので、発表直後は無条件で買いを入れるのが定石である","予想通りの結果でも前年比が3%台なら即座に大幅利上げが確定するため、株は必ず急落する","コアPCEは変動の大きい食品・エネルギーを含む指標なので、FRBの政策判断には全く使われない"],"correct":0,"explain":"コアPCEはFRBが重視する物価指標。結果が予想と一致すると金利先物の織り込みが大きく動かず、「イベント通過」でリスクプレミアムが縮小しやすい点が短期の焦点になります。今回は前年比+3.3%で据え置き継続の余地が意識されました。なおコアPCEは食品・エネルギーを除いた指標です。","chart":{"type":"bar","data":[{"label":"6月 前月比(%)","value":0.1},{"label":"7月 予想 前月比(%)","value":0.2},{"label":"7月 実績 前月比(%)","value":0.2},{"label":"7月 実績 前年比(%)","value":3.3}]}},{"cat":"直近ニュース","q":"米国時間8月26日引け後に発表されたエヌビディアの2026年5〜7月期決算は売上高962億ドル（前年同期比約2.1倍、市場予想約922億ドルを上振れ）、調整後EPS2.22ドル（予想2.09ドル）、8〜10月期見通しも1080億ドルと強かったが、時間外の株価は約2%下落した。この現象の説明として最も適切なのはどれか。","opts":["決算が予想を上回っても、事前に高い期待が株価に織り込まれていた場合は「良い決算＝株高」にならず、期待との差（サプライズの質）と持ち高整理が短期の値動きを決める","売上高が2倍になった企業の株が下がることは通常ありえず、取引システムの誤りである","EPSが予想を上回った場合、株価は必ず翌日ストップ高相当まで上昇する","次期見通しを開示した企業の株は制度上、決算翌日に売買が停止される"],"correct":0,"explain":"高期待銘柄では「予想超え」自体は前提として織り込まれており、上振れ幅・粗利益率・メモリー価格などの中身や、決算前に買い上がった資金の利益確定が優先されます。イベント通過での「材料出尽くし売り」は短期で頻出のパターンです。","chart":{"type":"bar","data":[{"label":"市場予想 売上高(億ドル)","value":922},{"label":"実績 売上高(億ドル)","value":962},{"label":"次期見通し(億ドル)","value":1080},{"label":"時間外株価変化(%)","value":-2}]}},{"cat":"直近ニュース","q":"2026年8月26日の東京株式市場で日経平均は半導体関連の売りで下げ幅が一時450円超に達したが、終値は前日比405円73銭高（+0.62%）の6万6262円16銭と続伸した。この日中の切り返しの説明として最も適切なのはどれか。","opts":["エヌビディア決算前の持ち高調整で半導体株が売られる一方、TOPIXが堅調で先物の売り方の買い戻しが入り、アドバンテストやソフトバンクGなど値がさ株や銀行株の上昇が指数を押し上げた","日経平均採用銘柄がすべて上昇したため、終始一貫して上げ幅を拡大した","半導体株が上昇し続け、金融株が売られたことで指数が押し上げられた","東証が取引時間を延長したことが唯一の上昇要因だった"],"correct":0,"explain":"寄り付きは大型イベント（半導体決算）前のリスク回避で半導体関連が下落。しかしTOPIXが強含んだことで日経平均先物の売り持ちに買い戻しが入り、値がさ株や日銀の利上げ観測を受けた銀行株の上昇が加わって切り返しました。指数と中身（内需・金融vs半導体）のズレを見るのが短期の要点です。","chart":{"type":"bar","data":[{"label":"前日終値(円)","value":65856},{"label":"日中安値めど(円)","value":65400},{"label":"終値(円)","value":66262}]}},{"cat":"直近ニュース","q":"2026年8月26日（現地）の米国市場では、ダウ工業株30種平均が4営業日ぶりに反落して113.52ドル安の5万3463.88ドル、ナスダック総合も21.10ポイント安の2万6130.20と小幅安だった。この日の値動きの背景として最も適切なのはどれか。","opts":["引け後に控えたエヌビディア決算を前に様子見姿勢が強まり、値幅を伴わない小幅安（ポジション縮小主体）となった","米PCEが大幅上振れしたため、両指数が3%超の急落となった","米国が金融緩和を突然発表し、指数が最高値を更新した","半導体株が全面高となり、指数は大幅高で引けた"],"correct":0,"explain":"大型イベント直前は新規のリスクテイクが控えられ、値幅の小さいもみ合い・小幅安になりやすい典型例です。同日発表のコアPCEは予想通りで新たな材料になりませんでした。短期トレードではイベント前の建玉圧縮とイベント後の方向性への対応が基本になります。","chart":{"type":"bar","data":[{"label":"ダウ 変化率(%)","value":-0.21},{"label":"ナスダック 変化率(%)","value":-0.08}]}},{"cat":"マクロ指標","q":"米7月の統計では、コアPCE価格指数が前年比+3.3%と底堅い一方、インフレ調整後の実質個人消費支出（実質PCE）は前月比ほぼ横ばいにとどまった。この「物価は粘着・実質消費は停滞」という組み合わせの一般的な解釈として最も適切なのはどれか。","opts":["インフレが下がりきらないまま需要が鈍る構図で、金融当局は動きにくく、株式では景気敏感株よりディフェンシブ・内需安定株が相対的に選好されやすい","物価と消費が同時に強い局面であり、景気敏感株の一斉高になりやすい","実質PCEが横ばいなら景気は完全に無関係で、株価には一切影響しない","物価が粘着していれば必ず即時の大幅利下げが実施される"],"correct":0,"explain":"物価粘着＋実質消費停滞は「スタグフレーション寄り」の組み合わせで、金融政策が緩和にも引き締めにも振りにくくなります。景気敏感・高PER銘柄には相対的に厳しく、ディフェンシブや価格転嫁力のある銘柄が選ばれやすい局面です。","chart":{"type":"bar","data":[{"label":"コアPCE 前年比(%)","value":3.3},{"label":"コアPCE 前月比(%)","value":0.2},{"label":"実質PCE 前月比(%)","value":0}]}},{"cat":"為替・金利","q":"ドル円が159円台前半で推移し、日本の長期金利（10年債利回り）が2.8%台後半へ上昇、日銀の追加利上げ観測が意識される局面での、東京市場のセクター反応として最も想定しやすいのはどれか。","opts":["利ざや改善期待から銀行・保険などの金融株が買われやすく、一方で高PERのグロース株や不動産・電力など金利負担の重い業種は相対的に売られやすい","金利上昇局面では金融株が最も売られ、高PERグロース株が最も買われる","金利が上がると円安が一段と進むため、輸入原材料比率の高い企業の利益は必ず改善する","長期金利は株式のバリュエーションと無関係なので、どの業種も同じ反応になる"],"correct":0,"explain":"国内金利上昇は銀行の利ざや改善期待に直結し金融株の買い材料。一方、割引率上昇は将来利益の現在価値を下げるため高PERグロースに不利で、借入依存の高い不動産・インフラ系にも重荷です。円安は輸入コストを押し上げるので選択肢3も誤りです。","chart":{"type":"bar","data":[{"label":"ドル円 年初来安値(円)","value":152.11},{"label":"ドル円 直近(円)","value":159.25},{"label":"ドル円 年初来高値(円)","value":163.96},{"label":"日本10年金利(%)","value":2.89}]}},{"cat":"歴史（急落）","q":"2013年5月23日、日経平均は前日比1,143円安（-7.3%）の14,483円98銭と急落した（いわゆるバーナンキ・ショック／中国PMI悪化）。この局面のその後の値動きとして正しいのはどれか。","opts":["翌24日は下値を試した後に小反発したが、その後も高ボラティリティが続き 待値の高い局面に絞る点が特徴です。","chart":{"type":"none","data":[]}}];

const MARKET = {"nikkei225":"66,262.16円","nikkei225Change":"+405.73 (+0.62%)","nikkeiLeverage":"取得できず（今回の検索では確認できませんでした）","nikkeiLeverageChange":"","usdJpy":"159.25円","usdJpyChange":"+0.25 (+0.15%)（前日終値159.00円比）","asOf":"2026年8月27日 早朝（日本時間9時20分頃）時点。日経平均は前営業日（8月26日）の終値、ドル円は8月27日6時54分頃の実勢値。日経レバレッジ上場投信（1570）は今回の検索では株価を確認できず未取得。"};

let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
