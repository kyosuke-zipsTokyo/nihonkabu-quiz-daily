<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年8月26日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

<script>
const QUESTIONS = [{"cat":"マクロ指標","q":"米雇用統計で非農業部門雇用者数はほぼ予想通りだったが、平均時給（AHE）が前月比+0.5%と予想（+0.3%）を上振れした。発表直後に短期トレードで最も想定しやすい反応の組み合わせはどれか。","opts":["賃金インフレ懸念で米金利上昇・ドル高円安、高PERのハイテク株には逆風","賃金上昇は消費拡大要因なので米金利低下・ドル安が定石","平均時給は遅行指標なので市場はまず無反応、翌日にCPIで動く","賃金上振れは常に株高要因で、グロース株が真っ先に買われる"],"correct":0,"explain":"平均時給はサービス価格を通じたインフレ粘着性の指標として重視される。上振れは利下げ期待の後退＝金利上昇・ドル高につながりやすく、割引率上昇に弱い高PER株（AI・半導体等）が売られやすい。円安は輸出株の支えになるため、日本株は指数内でバリュー優位・グロース劣位の入れ替わりになりやすい。","chart":{"type":"bar","data":[{"label":"AHE予想(前月比%)","value":0.3},{"label":"AHE結果(前月比%)","value":0.5}]}},{"cat":"マクロ指標","q":"米ミシガン大学消費者態度指数の速報値で、1年先期待インフレ率が3.0%→3.6%へ上昇した。短期トレードでの一般的な解釈として最も適切なものはどれか。","opts":["期待インフレの上昇はFRBが最も嫌う材料で、利下げ期待後退→金利上昇・株の押し下げ要因になりやすい","消費者調査は実体経済と無関係なので市場は反応しない","期待インフレ上昇は名目成長の加速を意味するので必ず株高","速報値は改定値まで市場に配信されないため無視できる"],"correct":0,"explain":"期待インフレが上振れすると「インフレ期待の再加速」を警戒して金利先高観が強まり、株の割高感が意識される。速報値（月半ば）と確報値（月末）の2回とも短期的な反応が出やすく、指数本体より期待インフレの数字に反応する局面が多い点がポイント。","chart":{"type":"bar","data":[{"label":"前月 1年先期待インフレ","value":3},{"label":"今回 1年先期待インフレ","value":3.6}]}},{"cat":"直近ニュース","q":"2026年8月25日の東京株式市場で日経平均は寄り付き後に前日比900円超下落する場面がありながら、終値は328円34銭高（+0.50%）の6万5856円43銭と3日ぶりに反発した。この日中の切り返しの説明として最も適切なものはどれか。","opts":["前日の米SOX指数下落を受けた半導体売りで急落した後、KOSPIの下落幅縮小や米株価指数先物の堅調、国内長期金利の上昇一服を受けて買い戻しが入った","日銀が臨時会合で追加緩和を決めたため急反発した","為替が急激な円高となり内需株が主導して指数を押し上げた","公的年金の大規模買い入れが公表され全面高となった"],"correct":0,"explain":"寄り付きは前日の米半導体株安（SOX約-2.7%）を映して半導体関連が売られたが、アジア株の下げ渋りと時間外のナスダック100先物の堅調で海外短期筋の先物買いが入り、金利上昇の一服も支えとなった。直近下落の大きかった銘柄への持ち高整理（売られすぎ銘柄の買い戻し）が中心で、商いは夏枯れの低水準だった。","chart":{"type":"line","data":[{"label":"8/21終値","value":66016},{"label":"8/24終値","value":65528},{"label":"8/25寄付","value":65195},{"label":"8/25終値","value":65856}]}},{"cat":"直近ニュース","q":"8月25日（現地）の米国市場では、ダウ平均が終盤に100ドル超高で推移した一方、ナスダック総合はマイナス圏で、半導体株が売られた。この日の物色の説明として最も適切なものはどれか。","opts":["エヌビディアの決算発表を控えたポジション調整で半導体が売られ、資金は景気敏感・ディフェンシブなどダウ構成の値がさ以外へ向かった","半導体株の下落は業績下方修正が相次いだためで、ダウも下落した","ナスダックの下落は長期金利の急騰が主因で、ダウも同時に大幅安となった","エヌビディア決算への期待で半導体が買われ、ナスダックだけが上昇した"],"correct":0,"explain":"大型イベント（今回はエヌビディア決算）の前は、含み益のある半導体・AI関連を軽くする「イベント前の利益確定・ヘッジ」が出やすい。指数間で強弱が分かれるのは資金の内部シフトであり、相場全体のリスクオフとは区別して考えるのが短期トレードの基本。","chart":{"type":"bar","data":[{"label":"ダウ(ドル、前日比)","value":148},{"label":"ナスダック(前日比%)","value":-0.4}]}},{"cat":"直近ニュース","q":"8月25日の米債券市場では、米財務省が保有する潤沢な手元資金（現金残高）の一部を取り崩す可能性が意識され、米10年債利回りが低下した。この材料が株式に及ぼす短期的な影響として最も適切なものはどれか。","opts":["国債発行（供給）圧力の緩和観測から金利が低下し、高PER株や金利敏感セクターの買い戻し材料になりやすい","財務省の現金取り崩しは増税観測につながるため株には常に弱材料","金利低下は必ず景気後退シグナルなので株は下落する","国債需給は株価と無関係で、株式市場は反応しない"],"correct":0,"explain":"入札増額や買い戻し（バイバック）など「国債需給」のニュースは、期間プレミアムを通じて長期金利に直接効く。手元資金の取り崩しは発行減額と同じ方向に働き、金利低下→割引率低下でグロース株・REIT・不動産などが反応しやすい。日本株では米金利低下が同日夜の先物・翌日の東京市場の支えになりやすい。","chart":{"type":"line","data":[{"label":"米10年債(前日)","value":4.72},{"label":"米10年債(当日)","value":4.63}]}},{"cat":"暴落の歴史","q":"1929年10月の「暗黒の木曜日」に始まる大恐慌局面で、NYダウはピークからボトムまでどの程度下落し、最高値回復までどれくらいかかったか。","opts":["約-89%（381→41ポイント）下落し、最高値回復は1954年まで約25年かかった","約-45%下落し、2年で最高値を回復した","約-60%下落し、5年で最高値を回復した","約-89%下落したが、翌1930年中に最高値を回復した"],"correct":0,"explain":"1929年9月の381.17から1932年7月の41.22まで約-89%。1954年11月にようやく1929年の高値を更新した。重要なのは1930年前半に約+50%の大幅な戻り（いわゆる戻り高値）があった点で、暴落後の急反発が必ずしも底入れを意味しないという教訓になる。","chart":{"type":"line","data":[{"label":"1929年9月高値","value":381},{"label":"1930年4月戻り高値","value":294},{"label":"1932年7月安値","value":41},{"label":"1954年11月最高値更新","value":382}]}},{"cat":"暴落の歴史","q":"1992年9月の「ポンド危機（ブラック・ウェンズデー）」について正しい説明はどれか。","opts":["英国はERM（欧州為替相場メカニズム）維持のため政策金利を10%→12%に引き上げ、さらに15%への追加引き上げを表明したが防衛できず離脱し、ポンドは急落した","英国が金利を引き下げてポンドを守り切り、ERMに残留した","ドイツが利下げしたためポンドが急騰した出来事である","ポンド危機は債券市場のみの出来事で、為替は動かなかった"],"correct":0,"explain":"1992年9月16日、英国は1日で10%→12%、さらに15%への引き上げを表明したが投機的売りを止められずERMを離脱。ポンドは対マルクで大幅安となり、ソロス率いるクォンタム・ファンドは巨額の利益を得た。「ファンダメンタルズに合わない固定的な相場水準は最終的に維持できない」という、政策と市場の力関係を示す典型例である。","chart":{"type":"bar","data":[{"label":"危機前の英政策金利(%)","value":10},{"label":"9/16 引き上げ後(%)","value":12},{"label":"表明された水準(%)","value":15}]}},{"cat":"伝説のトレーダー","q":"『オニールの成長株発掘法』で知られるウィリアム・オニールの「CAN-SLIM」に含まれる要素として最も適切なものはどれか。","opts":["当 let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
</body>
</html>
