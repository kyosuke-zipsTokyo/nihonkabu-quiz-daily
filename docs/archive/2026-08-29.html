<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年8月29日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

  <main>

  </main>

</div>

市場で日経平均は前日比273円58銭高（+0.41%）の6万6405円56銭と反発した。値がさ半導体株の主導ではなく、出遅れていたSaaS関連などが買われ、売買代金は膨らまなかった。この日の物色の説明として最も適切なのはどれか。","opts":["新規資金が大量に流入し、指数全体が幅広く上昇する典型的な強気相場だった","ジャクソンホールでの議長講演を控えた様子見で商いが細り、限られた資金が出遅れセクターへ循環する薄商いの上昇だった","日銀の利上げ観測後退で銀行株が主導した上昇だった","円高進行を好感して輸出関連が全面高となった"],"correct":1,"explain":"重要イベント前は積極的な買いが手控えられ、売買代金が減少しやすい。その中で指数がプラスになる場合、主力の半導体などではなく出遅れ・内需・SaaSなどへの循環物色が上昇要因になっていることが多い。薄商いでの上昇は継続性の判断が難しく、イベント通過後の初動で方向を確認するのが定石。","chart":{"type":"line","data":[{"label":"8/24","value":65528.09},{"label":"8/25","value":65856.43},{"label":"8/26","value":66262.16},{"label":"8/27","value":66131.98},{"label":"8/28","value":66405.56}]}},{"cat":"歴史的急落","q":"2016年6月24日、英国のEU離脱（ブレグジット）が国民投票で決まり、日経平均は1,286円33銭安（-7.92%）の14,952円02銭で引けた。この局面のその後の値動きとして正しいのはどれか。","opts":["下落が止まらず、年末まで一貫して下げ続けて1万2000円台まで沈んだ","翌営業日以降に急反発し、7月中には投票前の水準を回復、年末には1万9000円台まで上昇した","半年以上、1万5000円を挟んだ横ばいのまま推移した","翌日に前日の下落幅をすべて取り戻し、その後は再び急落した"],"correct":1,"explain":"投票結果はサプライズだったが、急落はポジション巻き戻し主導で、各国中銀の緩和期待もあり短期間で修復した。日経平均は7月末に16,500円台へ戻し、その後の米大統領選後の「トランプ相場」で年末には19,000円台へ上昇。政治イベントによる急落は、経済のファンダメンタルズが毀損していない限り戻りが速いというパターンの代表例。","chart":{"type":"line","data":[{"label":"2016/6/23","value":16238.35},{"label":"6/24","value":14952.02},{"label":"7/29","value":16569.27},{"label":"12/30","value":19114.37}]}},{"cat":"歴史的急落","q":"2011年3月の東日本大震災直後、日経平均は3月14日に-6.18%の9,620円49銭、翌15日に1,015円34銭安（-10.55%）の8,605円15銭まで急落した。この局面の推移として正しいのはどれか。","opts":["2営業日で約16%下落したが、G7の協調介入や復興需要期待で3月末には9,700円台まで戻した","下落は3月末まで続き、8,000円を大きく割り込んだ","急落翌日にストップ高水準まで全戻しし、その後最高値を更新した","為替は円安に振れ続け、株価は一貫して上昇した"],"correct":0,"explain":"原発事故への懸念でパニック売りとなり2営業日で約16%下落したが、その後は円が急騰（一時76円台）したことを受けた3月18日のG7協調介入や復興需要期待で急反発し、3月31日には9,755円10銭まで戻した。災害・パニック型の急落は、需給の投げが一巡すると短期間でV字的に戻りやすいのが特徴。","chart":{"type":"line","data":[{"label":"3/10","value":10434.38},{"label":"3/14","value":9620.49},{"label":"3/15","value":8605.15},{"label":"3/31","value":9755.1}]}},{"cat":"伝説のトレーダー","q":"『私は株で200万ドル儲けた』で知られるニコラス・ダーバスの「ボックス理論」の中核として、最も適切なものはどれか。","opts":["株価が形成した一定の値幅（ボックス）の上限を出来高を伴って上抜けたところを買い、直近ボックス下限割れで機械的に損切りする","企業の解散価値を算出し、時価総額が下回る割安株を長期保有する","下落した銘柄を等間隔で買い増すナンピンで平均取得単価を下げる","配当利回りの高い銘柄だけを保有し、値動きは無視する"],"correct":0,"explain":"ダーバスはダンサーとして世界を巡りながら電報で株価だけを見て売買し、株価が推移する値幅を「箱（ボックス）」と捉えた。上のボックスへ移行する動き（出来高増を伴う新高値）を買いのサインとし、逆行したら即撤退するトレーリングストップ的な手法を徹底した。値幅ブレイクアウト＋損切り徹底という点で、現代のトレンドフォローの原型のひとつとされる。","chart":{"type":"bar","data":[{"label":"開始資金(ドル)","value":25000},{"label":"約18カ月後(ドル)","value":2000000}]}},{"cat":"伝説のトレーダー","q":"ルネサンス・テクノロジーズを率いたジム・シモンズと旗艦の「メダリオン・ファンド」の手法として、最も適切なものはどれか。","opts":["1銘柄に資金を集中し、経営陣と対話して企業価値の向上を促す","マクロ経済の大局観をもとに、通貨や金利で大きなレバレッジを掛けた集中ポジションを取る","膨大なデータから統計的に小さな優位性（エッジ）を多数見つけ、短期売買を高頻度で大量に繰り返して勝率のわずかな偏りを積み上げる","四半期決算のサプライズだけを根拠に、決算発表後に長期保有する"],"correct":2,"explain":"シモンズは数学者・暗号研究者出身で、経済理論よりもデータのパターンを重視した。個々のトレードの優位性は僅かでも、取引回数を極めて多くして分散させることで安定した収益に変えるのが基本思想。メダリオンは1988年以降、手数料控除前で年率60%超という驚異的な成績を残したとされる。短期トレードでは「1回の勝負より、期待値がプラスの行動を繰り返す」という発想が学びどころ。","chart":{"type":"bar","data":[{"label":"メダリオン 年平均(費用前,%)","value":66},{"label":"メダリオン 年平均(費用後,%)","value":39},{"label":"S&P500 同期間目安(%)","value":10}]}},{"cat":"金利・債券","q":"8月28日の米債券市場では、2年債利回りが4.296%へ上昇（+0.064）した一方、10年債は4.668%（-0.008）、30年債は5.162%（-0.031）と低下した。この動きの読み方として最も適切なのはどれか。","opts":["短期ゾーン主導のフラット化で、市場が金融引き締め（利上げ）観測を強めたことを示す","長期ゾーン主導のスティープ化で、景気回復と物価上昇期待が強まったことを示す","全期間の利回りが低下しており、リスクオフが強まったことを示す","利回り曲線の形状は株式のセクター物色とは無関係である"],"correct":0,"explain":"2年債利回りは今後1〜2年の政策金利見通しを最も強く反映する。2年が上昇し10年・30年が低下する「ベアフラット化」は、金融引き締めで将来の景気・インフレが抑え込まれるとの見方を示す。株式では割引率上昇に弱い高PERのグロース株が相対的に不利、金利収入が増える銀行株には追い風になりやすい。","chart":{"type":"bar","data":[{"label":"2年債(%)","value":4.296},{"label":"10年債(%)","value":4.668},{"label":"30年債(%)","value":5.162}]}},{"cat":"商品性の理解","q":"日経レバレッジ上場投信（1570）のようなレバレッジ型ETFについて、短中期トレードで必ず理解しておくべき性質はどれか。","opts":["1年間の騰落率が必ず日経平均の2倍になるよう設計されている","「日々の」騰落率の2倍を目指す設計のため、上下動を繰り返すレンジ相場では指数が元の水準に戻っても価格は目減りしやすい","信託報酬が無料なので長期保有に最も適した商品である","日経平均が下落した日は必ず1570も同率で下落し、乖離は一切生じない"],"correct":1,"explain":"レバレッジ型ETFは「1日単位」で指数の2倍の値動きを目指す設計であり、複利効果により保有期間が長くなるほど指数の2倍からの乖離が生じる。例えば指数が100→90→100と往復した場合、2倍型は100→80→約97.8となり約2%目減りする（ボラティリティ・ディケイ）。値動きの荒いレンジ相場ほど不利で、方向感が出た短期間の勝負に使う商品と理解すべき。","chart":{"type":"line","data":[{"label":"指数 開始","value":100},{"label":"指数 -10%後","value":90},{"label":"指数 戻り","value":100},{"label":"2倍型 -20%後","value":80},{"label":"2倍型 +22.2%後","value":97.8}]}}];

let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
