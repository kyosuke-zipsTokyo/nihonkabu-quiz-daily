<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年9月4日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

<script>
const QUESTIONS = [{"cat":"マクロ指標（雇用統計）","q":"2026年9月4日（日本時間）夜に発表される米8月雇用統計について、前月の非農業部門雇用者数（NFP）は-2.3万人と減少し、8月の市場予想は+5.0万〜5.6万人程度への回復とされる。一方、先行指標のADP雇用リポートは弱く、2カ月連続マイナスというネガティブサプライズへの警戒もくすぶる。この状況での短中期トレードの構え方として最も適切なのはどれか。","opts":["予想レンジの幅（マイナス〜プラス5万人台）が広く結果次第で金利・為替が大きく振れるため、発表前はポジションを軽くし、発表後の初動の逆行（ヘッドラインと詳細の乖離）まで確認して方向を決める","予想が前月から改善なので、発表前に日経平均先物を全力で買い持ちするのが唯一の合理的な選択である","雇用統計は毎月出る定例指標なので株価への影響はほぼなく、発表日は通常どおりのサイズで売買してよい","雇用者数が予想を下回れば必ず株安になるため、事前に株の売りポジションを最大化しておくべきである"],"correct":0,"explain":"NFPは短期の金利・為替・株のボラティリティを最も大きく動かすイベントで、しかも今回は「回復」と「2カ月連続マイナス」の両シナリオが併存し予想の分散が大きい。分散が大きいイベント前はサイズを落とし、発表後は失業率・平均時給・改定値まで見て初動の巻き戻しを確認するのが定石。弱い雇用は「利下げ期待→株高」にも「景気悪化→株安」にも解釈され得るため、方向を事前に決め打ちするのは危険。","chart":{"type":"bar","data":[{"label":"7月NFP（実績・万人）","value":-2.3},{"label":"8月予想下限（万人）","value":5},{"label":"8月予想上限（万人）","value":5.6}]}},{"cat":"為替と株の短期連動","q":"2026年9月3日のドル円は終値ベースで約1.8%の大幅安（円高）となり、一時155.30円前後まで下落、直近2日間で5円程度の円高が進んだ。背景は日銀の利上げ加速観測とFRBの利上げ期待後退である。この局面で短期的に想定しやすい日本株の動きはどれか。","opts":["円高進行で輸出・グローバル製造業の想定為替レートに下押し圧力がかかり、自動車・機械などの外需株が相対的に売られやすく、内需・ディフェンシブが相対優位になりやすい","円高は輸入コスト低下なので日本株全体が一方向に急騰し、業種間の格差はほぼ生じない","日銀の利上げ観測は銀行株にとって常に悪材料であり、金融セクターが最も売られやすい","為替は株式の業種別パフォーマンスと無関係なので、円高局面でも物色の偏りは起きない"],"correct":0,"explain":"短期では為替は業種間の相対パフォーマンスを大きく左右する。急な円高は輸出企業の想定レート未達懸念から外需株の逆風となり、資金は内需・ディフェンシブへ回りやすい。一方、日銀の利上げ観測は利ざや改善期待で銀行株には追い風になりやすく、「銀行が最も売られる」は誤り。指数全体の方向より、円高の受益・被害セクターの入れ替わりを取るのが短期戦略の要点。","chart":{"type":"line","data":[{"label":"2日前終値（円）","value":160.3},{"label":"前日終値（円）","value":158.7},{"label":"9/3安値圏（円）","value":155.3},{"label":"9/4早朝（円）","value":155.8}]}},{"cat":"直近24時間の米国市場","q":"2026年9月3日の米国市場はダウ工業株30種平均が624.16ドル高（+1.18%）の5万3,686.11ドル、S&P500種が+1.06%の7,747.71、ナスダック総合が+1.4%の2万6,584.06と大幅高で終えた。テスラは引け後のロボタクシー（サイバーキャブ）発表イベントを控えて7%超上昇した。この日の動きの読み方として最も適切なのはどれか。","opts":["ナスダックの上昇率がダウを上回り、金利上昇と原油高で叩かれていた高ベータのハイテク・グロースにリスク選好が戻った反発局面であり、週明けではなく翌日の東京市場ではハイテク・半導体関連の買い戻しが波及しやすい","3指数がそろって上昇したので、以後の下落リスクは完全に消えたと判断してよい","テスラの上昇はイベント発表後の結果を反映したものなので、イベント通過後の失望売りは起こり得ない","ダウの上げ幅がナスダックの上昇率より大きいので、この日はディフェンシブ主導の相場だった"],"correct":0,"explain":"上昇率でナスダック（+1.4%）＞S&P500（+1.06%）＞ダウ（+1.18%はドル高だが率では中位）という並びは、金利・原油高で売られていた高ベータのハイテク・グロースへの買い戻し主導を示す。これは翌営業日の東京市場で半導体・AI関連の反発に波及しやすい。ただしテスラのようなイベント前の思惑買いは「イベント通過＝材料出尽くし」で反落することも多く、上昇一日で下落リスクが消えるわけでもない。","chart":{"type":"bar","data":[{"label":"ダウ（%）","value":1.18},{"label":"S&P500（%）","value":1.06},{"label":"ナスダック（%）","value":1.4},{"label":"テスラ（%）","value":7}]}},{"cat":"直近の日経平均の値動き","q":"2026年9月の東京市場で日経平均は、9月1日に前日比96.59円安の6万6,215.34円、2日に1,889.70円安（-2.85%）の6万4,325.64円、3日に111.16円安（-0.17%）の6万4,214.48円となり、3日には日経平均が小幅安ながらTOPIXは20.44ポイント高（+0.50%）だった。この推移の解釈として最も適切なのはどれか。","opts":["大幅安の翌日に日経平均が小幅安で下げ渋りつつTOPIXがプラスに転じており、指数寄与度の大きい値がさハイテクの売りが続く一方で幅広い銘柄には買いが入る「内部での資金入れ替え」が起きている","3日続落しているので市場全体が一様に投げ売り状態にあり、全業種が下落したと判断できる","日経平均が下落しTOPIXが上昇することは指数計算上あり得ないので、データの誤りである","前日に2.85%下落した後の小幅安は必ず下降トレンド継続を意味し、反発の可能性は考慮不要である"],"correct":0,"explain":"日経平均は値がさ株の株価平均型、TOPIXは時価総額加重型のため、両者の逆行は寄与度の大きいハイテク・値がさ株の売りと、その他多数銘柄の買いが同時に起きているサインになる。急落翌日の「下げ渋り＋TOPIX反発」はセリング・クライマックス後の資金入れ替えの典型で、全面投げ売りとは異なる。短期では売られ過ぎ銘柄の反発と、下げ止まらない主役株の見極めが重要になる。","chart":{"type":"line","data":[{"label":"9/1終値","value":66215.34},{"label":"9/2終値","value":64325.64},{"label":"9/3終値","value":64214.48}]}},{"cat":"レバレッジETFの特性","q":"日経平均レバレッジ・インデックス連動型上場投信（1570）などのレバレッジ型ETFを短期トレードで使う際の注意点として、最も適切なのはどれか。","opts":["日々のリターンを指数の約2倍に調整する仕組みのため、上下に振れる往復相場では基準となる指数が元に戻ってもETFの価格は目減りしやすく、保有期間が長くなるほど乖離が拡大しやすい","指数の2倍の値動きを長期にわたり正確に再現するため、数カ月〜数年の中長期保有に最も適している","レバレッジETFは信用取引と異なり価格変動リスクが2倍にならないので、資金管理は現物株と同じ考え方でよい","日経平均が上下に往復して元の水準に戻れば、レバレッジETFの価格も必ず元の水準に戻る"],"correct":0,"explain":"レバレッジETFは「日次リターンの2倍」を目標に毎日リバランスするため、複利効果でボラティリティの高い往復相場では価格が目減りする（ボラティリティ・ディケイ）。例えば指数が+10%→-9.09%で元に戻る場合、2倍型は+20%→-18.18%で約-1.8%目減りする。したがって方向が出ている短期の局面での使用に向き、長期保有には不向き。値動きも指数の約2倍なので資金管理は現物より厳格にすべき。","chart":{"type":"line","data":[{"label":"指数（起点=100）","value":100},{"label":"指数 +10%","value":110},{"label":"指数 -9.09%で元に戻る","value":100},{"label":"2倍型ETF 同期間後","value":98.2}]}},{"cat":"金利とバリュエーション","q":"2026年9月初めの米10年債利回りは5営業日続伸して一時4.81%台（2023年10月以来の高水準）を付け、その後9月3日にはNY連銀ウィリアムズ総裁のハト派発言や原油の伸び悩みで低下した。長期金利の変動が短期の株式物色に与える影響の理解として最も適切なのはどれか。","opts":["割引率上昇の影響を受けやすい高PER・高成長株ほど長期金利の上昇に弱く、金利が低下に転じた局面ではその反動でハイテク・グロースの反発幅が大きくなりやすい","長期金利は業績に直接効かないので、金利が動いてもセクター間の優劣は変わらない","金利上昇局面では常に高PERのハイテク株が最も買われ、低PERのバリュー株が売られる","金利が低下すると必ず株価指数全体が下落するため、金利低下は株の売りサインである"],"correct":0,"explain":"DCFの考え方では将来キャッシュフローの比重が大きい高PER・高成長株ほど割引率（長期金利）の上昇に弱い。よって金利急騰局面ではハイテク・グロースが売られ、金利がピークアウトすると同じ銘柄群が最も強く反発しやすい。実際に9月3日は金利低下でナスダック主導の反発となった。金利低下が景気悪化懸念を映す場合は株安になることもあるため、低下の「理由」の確認も必要。","chart":{"type":"line","data":[{"label":"米10年債 高値圏(%)","value":4.81},{"label":"9/2終盤(%)","value":4.79},{"label":"参考:ナスダック9/3騰落率(%)","value":1.4}]}},{"cat":"歴史的暴落（ブレグジット）","q":"2016年6月24日、英国のEU離脱（ブレグジット）を問う国民投票の結果が伝わる中で日経平均は1,286円33銭安（-7.92%）の1万4,952円02銭まで急落した。この局面の説明として最も適切なのはどれか。","opts":["投票日の日中は残留優勢との観測で株高・円安が進んだが、離脱確定に向かうにつれ急速に円高が進み株価が暴落し、その後は各国中央銀行の緩和期待などから数カ月かけて下落分を回復していった","離脱が決まった後も円安が続いたため、日本株は輸出株主導で当日中に上昇に転じた","急落後の日経平均は年内に回復することなく、下落が一方的に続いた","当日の急落は日本株固有の要因で、英ポンドや欧州株はほとんど動かなかった"],"correct":0,"explain":"ブレグジット票決日は日中に「残留優勢」の観測で楽観が広がっていたため、結果判明に伴う急激な円高とポンド暴落が日本株の下げを増幅した。イベント・リスクでは「事前のコンセンサスに傾いたポジションの巻き戻し」が下げを大きくする。もっとも金融政策への緩和期待などから相場は数カ月で下落分を回復し、政治イベントによる急落が中期的には押し目となった典型例でもある。","chart":{"type":"bar","data":[{"label":"日経平均 下落幅（円）","value":-1286},{"label":"下落率（%）","value":-7.92},{"label":"終値（円）","value":14952}]}},{"cat":"歴史的急変（VIXショック）","q":"2018年2月5〜6日のいわゆる「VIXショック」の説明として最も適切なのはどれか。","opts":["米賃金上昇による金利上昇懸念をきっかけにVIXが一日で史上最大級の急騰となり、ボラティリティ売り戦略やリスク・パリティ型の機械的な売りが連鎖して株価下落が増幅した","企業業績の急激な悪化が判明したことが原因で、株価は数年にわたり下落基調が続いた","VIXは下落し株価だけが下がるという珍しい現象が起きた局面である","ボラティリティ関連商品の残高は小さく、株価下落を増幅させる効果は一切なかった"],"correct":0,"explain":"VIXショックは、強い賃金指標を受けた金利上昇懸念が引き金となり、低ボラティリティ環境を前提にしたボラティリティ売り（インバースVIX商品等）の強制解消が連鎖した「需給主導」の急落だった。業績悪化が起点ではなく、株価も比較的短期間で立て直した。短期トレードでは、こうした「ポジション偏りの巻き戻し」による急落は値幅が大きい一方で戻りも速い、という認識が重要になる。","chart":{"type":"bar","data":[{"label":"2018/2/5 ダウ下落幅（ドル）","value":-1175},{"label":"下落率（%）","value":-4.6},{"label":"VIX終値（同日）"," const MARKET = {"nikkei225":"64,214.48円","nikkei225Change":"-111.16 (-0.17%)","nikkeiLeverage":"6万5,000円台（9月3日終値は未確認。9月2日終値は65,350円、3日の日中レンジは65,090〜66,270円）","nikkeiLeverageChange":"参考：9月3日午前10時32分時点で+250 (+0.38%)。同日終値ベースの前日比は未確認","usdJpy":"155円台後半（約155.8円）","usdJpyChange":"前日終値ベースで約-1.8%の円高（一時155.30円前後、直近2日間で約5円の円高）","asOf":"2026年9月4日 早朝（日本時間）時点。日経平均は前営業日（9月3日）の終値、日経レバレッジ上場投信（1570）は9月2日終値および9月3日の日中値を参照した参考値（9月3日終値は未確認）。ドル円は9月4日早朝の実勢レート。"};

let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
