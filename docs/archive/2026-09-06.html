<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年9月6日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

  <header>

    <div class="progress-row" id="progressRow"></div>
    <div class="market-bar" id="marketBar"></div>
  </header>

  <main>

  </main>

  <footer>このクイズはClaudeが自動生成した学習用コンテンツです。投資助言ではありません。</footer>
</div>

<script>
const QUESTIONS = [{"cat":"マクロ指標","q":"2026年9月4日発表の米8月雇用統計は非農業部門雇用者数が前月比16万2000人増と市場予想（約5万3000人増）を大幅に上回り、6月・7月分も上方修正、失業率は4.1%だった。これを受け9月FOMCでの利上げ観測が強まった。短中期トレーダーが「次に」最も重視すべきイベントとその構えとして最も適切なのはどれか。","opts":["雇用統計で方向は確定したので、来週の米CPIは無視して金利上昇シナリオに全力で賭ける","来週発表の米CPIなど物価指標がFOMCの最終判断を左右するため、金利感応度の高いグロース株の建玉を絞り、CPI通過後に方向性を確認して追随する","雇用統計が強かった以上、必ず株は下げ続けるので指数の空売りを事実上の無期限で保有する","米指標は日本株には関係がないため、国内材料のみで売買すればよい"],"correct":1,"explain":"雇用の下振れ懸念が後退した結果、政策判断の主役は物価に移ります。米10年債利回りは一時4.81%まで上昇したものの終値近辺では4.78%台と、市場は次のCPIを待つ姿勢でした。イベント前は建玉を軽くし、結果を見て方向についていくのが短中期では再現性の高い対応です。断定的な決め打ちや「無関係」とする判断は誤りです。","chart":{"type":"bar","data":[{"label":"8月NFP実績(千人)","value":162},{"label":"市場予想(千人)","value":53},{"label":"7月NFP(千人)","value":-23},{"label":"失業率(%)","value":4.1}]}},{"cat":"直近ニュース","q":"2026年9月4日、米運輸省高速道路交通安全局（NHTSA）がテスラのロボタクシー専用車両に関する調査を開始したと発表し、前日にイベント期待で急伸していたテスラ株は反落、ナスダック総合の重荷となった。この種の「規制当局の調査開始」報道に対する短期トレードの考え方として最も適切なのはどれか。","opts":["調査開始は最終処分ではないが、期待先行で買われた銘柄ほど利益確定の口実になりやすく、まずは需給の巻き戻しを警戒してポジションを縮小する","調査開始は必ずリコールや罰金につながるので、即座に全額を空売りに回す","規制ニュースは株価に影響しないので、前日のイベント期待の買いをそのまま継続する","調査開始は好材料なので、押し目は全て買い増しのチャンスと判断する"],"correct":0,"explain":"規制調査は結論が出るまで時間がかかり、ファンダメンタルズへの影響は不確定です。しかしイベント前に期待で上昇した銘柄は「材料出尽くし＋不透明感」の二重の売り圧力を受けやすく、短期では需給の巻き戻しが先行します。結論を決め打ちせず、まずリスク量を落とすのが定石です。","chart":{"type":"bar","data":[{"label":"NYダウ(%)","value":-0.5},{"label":"ナスダック総合(%)","value":-0.29},{"label":"ダウ下げ幅(ドル)","value":-271.86}]}},{"cat":"直近ニュース","q":"2026年9月3日、半導体メモリー大手マイクロン・テクノロジーがAI向け広帯域メモリー（HBM）の生産能力倍増を検討していると韓国メディアが報じ、翌4日の米市場でも関連銘柄に買いが入った。日本株の短期トレードでの受け止め方として最も適切なのはどれか。","opts":["メモリー増産はメモリー価格の下落要因のみを意味するので、日本の半導体関連は一律に売りである","米国の一社の報道であり、日本の半導体製造装置・部材への波及は一切考えなくてよい","増産計画は前工程・後工程の装置や検査装置への投資期待につながるため、東京エレクトロンやアドバンテストなど装置・検査関連のADRや時間外の動きを翌日の寄り付き前に確認する","報道は憶測なので、公式発表が出るまで株価は一切動かない"],"correct":2,"explain":"設備投資の増加観測は装置・部材メーカーの受注期待に直結し、日本の半導体関連の先行材料になります。実際4日のADR市場では東京エレクトロンなどが対東証比で上昇しました。短期では「米国の材料→ADR・CME→翌日の東京寄り付き」という伝播経路を寄り前にチェックするのが基本です。","chart":{"type":"bar","data":[{"label":"東エレクADR 日本終値比(円)","value":1830},{"label":"日立ADR 日本終値比(円)","value":40},{"label":"TDK系ADR 日本終値比(円)","value":32.5}]}},{"cat":"直近ニュース","q":"2026年9月4日の東京市場で日経平均は806円46銭高（+1.26%）の6万5,020円94銭と5営業日ぶりに反発したが、TOPIXは1.19ポイント高（+0.03%）にとどまった。ソフトバンクグループが約474円、アドバンテストが約196円と2銘柄で上げ幅の8割強を占め、キオクシア1銘柄で約1.65兆円が売買された（市場全体の売買代金は約8.3兆円）。この日の解釈として最も適切なのはどれか。","opts":["値がさAI関連への資金集中による指数主導の上昇であり、全面高ではないため個別戦では上値追いより銘柄選別と利食いの機動性が重要","日経平均が800円高なのだから、ほぼ全銘柄が上昇した全面高であり、何を買っても勝ちやすい","売買代金が一部銘柄に集中するのは相場崩壊の直前サインであり、必ず翌日は暴落する","TOPIXが小幅高だったので、実際には日経平均も下落していたことになる"],"correct":0,"explain":"プライム市場の値上がりは788、値下がり712とほぼ拮抗しており、指数の上昇幅ほど市場全体は強くありませんでした。値がさ株の寄与に依存した上昇では、主導株が息切れすると指数も失速しやすいため、指数の強さと物色の広がり（breadth）を分けて評価する必要があります。","chart":{"type":"bar","data":[{"label":"SBG寄与(円)","value":474},{"label":"アドテスト寄与(円)","value":196},{"label":"その他合計(円)","value":136},{"label":"キオクシア売買代金(兆円)","value":1.65}]}},{"cat":"需給・先物","q":"2026年9月4日、日経平均は6万5,020円94銭で引けたが、同日のシカゴ日経平均先物（CME）は円建て清算値6万5,830円と大阪取引所の日中終値比プラス1,270円で終えた。この情報の短期トレードでの使い方として最も適切なのはどれか。","opts":["CME清算値は日本時間の取引に無関係なので、翌営業日の寄り付きの参考にはならない","CME清算値は翌営業日の日経平均の終値を確定させるため、その水準を目標にした買いを入れておけばよい","米国時間の材料を織り込んだ水準として翌営業日の寄り付きの目安になるが、ギャップアップ後の初動は利益確定売りも出やすく、寄り天のリスクを想定して分割で対応する","CMEが大証比プラスなら必ず日中も上昇し続けるので、寄り成りで全力買いすべきである"],"correct":2,"explain":"CME清算値は日本市場の引け後に出た米材料や為替を織り込んだ「翌日の想定水準」として有用です。ただし寄り付きでギャップを埋めた後は、前日までの含み益を確定する売りや、寄り付き直後の高値からの反落（寄り天）が頻繁に起こります。あくまで目安として、分割エントリーや損切り水準の事前設定が前提です。","chart":{"type":"bar","data":[{"label":"日経平均 9/4終値","value":65020.94},{"label":"CME円建て清算値","value":65830},{"label":"大証比(円)","value":1270}]}},{"cat":"金利・為替","q":"2026年9月5日早朝時点で米10年債利回りは4.784%（前日比+0.013%）、一方で日本の10年債利回りは9月4日に前日比0.065%低下して2.900%程度となった。この日米金利差と円相場の関係の理解として最も適切なのはどれか。","opts":["名目上の金利差は依然2%近くあるが、市場は「差の水準」より「差の変化方向」に反応しやすく、日銀の利上げ加速観測で差の縮小が意識されれば円高圧力がかかる","金利差が2%近くある限り、円高になることは理論上あり得ない","日本の長期金利が低下したのだから、必ず円安が進行し輸出株が買われる","為替は金利差だけで決まるため、日銀やFRBの発言・需給要因は考慮する必要がない"],"correct":0,"explain":"為替は金利差の絶対水準よりも、その将来的な変化（期待）に敏感に反応します。9月上旬は日銀の利上げペース加速観測が広がり、日米金利差の縮小が意識されたことで円は3営業日続伸し一時155円台前半を付けました。金利差だけでなく let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
