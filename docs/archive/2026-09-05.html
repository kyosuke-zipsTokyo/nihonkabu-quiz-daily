<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のトレードクイズ｜2026年9月5日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --ink:#12213a;
    --paper:#f7f3ea;
    --paper-dim:#efe9db;
    --up:#c23b3b;      /* 日本式：値上がり=赤 */
    --down:#2f7d5c;    /* 日本式：値下がり=緑 */
    --gold:#b8863b;
    --line:#d8d0bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .board{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    margin:4px 0 14px;
    font-weight:700;
  }
  .progress-row{
    display:flex;
    gap:5px;
  }
  .dot{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .dot i{
    display:block;
    height:100%;
    width:0%;
    background:var(--ink);
    transition:width .3s ease;
  }
  main{padding:24px;}
  .cat{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    padding:3px 9px;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:100px;
    margin-bottom:14px;
    font-weight:500;
  }
  .qnum{
    font-family:'Shippori Mincho',serif;
    font-size:13px;
    color:#8a8270;
    margin-bottom:6px;
  }
  .question{
    font-size:18px;
    line-height:1.6;
    font-weight:500;
    margin-bottom:20px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.correct{
    border-color:var(--up);
    background:#fdf0ef;
    font-weight:700;
  }
  .opt.wrong{
    border-color:var(--down);
    background:#eef6f1;
  }
  .opt:disabled{cursor:default;}
  .explain{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:var(--paper-dim);
    border-left:3px solid var(--gold);
    border-radius:3px;
    font-size:13.5px;
    line-height:1.75;
  }
  .explain.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .explain h3{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--gold);
    margin:0 0 8px;
  }
  .chart-wrap{margin-top:14px;}
  .next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .next.show{display:block;}
  .result{display:none;text-align:center;padding:10px 4px;}
  .result.show{display:block;}
  .result .score{
    font-family:'Shippori Mincho',serif;
    font-size:44px;
    margin:6px 0 2px;
  }
  .result p{font-size:13.5px;color:#5b543f;line-height:1.7;}
  .news-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:13px;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .news-btn.show{display:block;}
  .news{display:none;text-align:left;}
  .news.show{display:block;animation:fade .35s ease;}
  .news-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .news-item:last-child{border-bottom:none;}
  .news-src{
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  .news-title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:5px;
  }
  .news-sum{
    font-size:12.5px;
    color:#5b543f;
    line-height:1.6;
    margin-bottom:6px;
  }
  .news-link{
    font-size:11.5px;
    color:var(--up);
    text-decoration:none;
    font-weight:700;
  }
  .mark{
    float:right;
    font-size:17px;
    font-weight:900;
    line-height:1;
  }
  .mark-correct{color:var(--up);}
  .mark-wrong{color:var(--down);}
  .market-bar{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .market-row{
    display:flex;
    gap:8px;
  }
  .market-item{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
  }
  .market-label{
    font-size:10px;
    color:#8a8270;
    margin-bottom:3px;
  }
  .market-value{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .market-change{
    font-size:10.5px;
    font-weight:700;
    margin-top:2px;
  }
  .market-asof{
    font-size:9.5px;
    color:#9a927c;
    margin-top:8px;
    text-align:right;
  }
  footer{
    padding:14px 24px 20px;
    font-size:11px;
    color:#9a927c;
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>

  <main>

</div>

const QUESTIONS = [{"cat":"マクロ指標（米雇用統計）","q":"2026年9月4日（日本時間21時30分）発表の米8月雇用統計は、非農業部門雇用者数が前月比16.2万人増と市場予想（約5.5万人増）を大幅に上回り、失業率は4.1%で横ばいだった。前月7月は2.3万人減だっただけに強い反発となり、米長期金利は上昇、NYダウは271.86ドル安の5万3,414.25ドルと反落した。この「強い雇用→株安」の反応の読み方として最も適切なのはどれか。","opts":["景気が強いのだから株価は必ず上がるはずで、下落は誤りなので全力で押し目買いすべきだ","現在はFRBの追加利上げリスクが意識される局面で、強い指標は金利上昇→株式のバリュエーション圧縮につながるため、指標の強弱そのものより『金融政策の織り込みがどう動くか』を見るべきだ","雇用統計は月1回なので短期トレードには一切影響がなく、無視してよい","失業率が横ばいだったのだから雇用者数の数字は無意味である"],"correct":1,"explain":"同じ「強い指標」でも、利下げ期待が相場を支えている局面ではポジティブに、利上げ警戒局面ではネガティブに働きます。今回は9月会合での利上げ確率が跳ね上がり、米10年債利回り上昇とともに株が売られました。短期トレードでは指標の絶対値ではなく、それが金融政策の織り込み（FF金利先物）と金利をどう動かしたかを起点に判断します。","chart":{"type":"bar","data":[{"label":"7月NFP実績(万人)","value":-2.3},{"label":"8月市場予想(万人)","value":5.5},{"label":"8月実績(万人)","value":16.2}]}},{"cat":"直近ニュース（東京市場）","q":"2026年9月4日の東京市場で日経平均は前日比806円46銭高（+1.26%）の6万5,020円94銭と5営業日ぶりに大幅反発した。前日までの4日続落で約2,200円下げていたことに加え、前日の米国株高（ダウ624ドル高）と国内長期金利の低下が支援材料となった。この反発の性格として最も適切な解釈はどれか。","opts":["4日続落後の自律反発に、米株高・金利低下という外部材料が重なった戻り局面であり、同日夜の米雇用統計というイベントを控えて上値追いには慎重さも残る","4日続落したのだから機械的に必ず5日目は上がるという法則が働いた","日経平均が上がった以上、全銘柄が均等に上昇したはずである","日中の値動きは為替や金利とは無関係に決まる"],"correct":0,"explain":"この日の上昇はソフトバンクGやアドバンテストなど値がさハイテク主導で、TOPIXの上昇率は日経平均より小さく、指数寄与度の偏った戻りでした。連続下落後の自律反発＋外部環境改善という組み合わせは典型的な戻り局面ですが、重要イベント（米雇用統計）前は持ち越しリスクを意識した建玉管理が求められます。","chart":{"type":"line","data":[{"label":"9/1終値","value":66215.34},{"label":"9/2終値","value":64325.64},{"label":"9/3終値","value":64214.48},{"label":"9/4終値","value":65020.94}]}},{"cat":"為替と日本株","q":"2026年9月4日の東京外国為替市場で円相場は3営業日続伸し一時1ドル=155円台前半を付けた。背景には日銀の利上げ加速観測がある。その後、米雇用統計が予想を上回ったことでドルは買い戻され、9月5日早朝時点では156円台前半で推移した。この一連の値動きの短期トレードでの活かし方として最も適切なのはどれか。","opts":["円高が進んだ日は輸出関連が売られやすい一方、日米金利差観測が主因のため『日銀イベント→円高』『米指標好調→円安戻り』と材料ごとに主役が入れ替わる点を意識して、為替の起点が日本側か米国側かを見極める","円高になれば日本株は必ず全面安になるので売り一択である","為替は株価と無関係なので見る必要はない","155円を割れば必ず政府・日銀が介入するため、円買いは安全である"],"correct":0,"explain":"ドル円は「日本側の材料（日銀の利上げ観測）」と「米国側の材料（雇用統計・FRB高官発言）」のどちらが主導かで、日本株への波及の仕方が変わります。日銀主導の円高なら金利上昇を伴い銀行株が買われ輸出株が売られやすく、米指標主導の円安戻りならハイテク・輸出中心に買い戻しが入りやすい、といった整理が有効です。","chart":{"type":"line","data":[{"label":"9/3頃","value":158},{"label":"9/4東京 一時","value":155.3},{"label":"9/5早朝","value":156.23}]}},{"cat":"金利と物色","q":"2026年9月4日の東京市場では、日本の10年物国債利回りが前日比0.065%低下して2.900%程度となった。これが同日の日本株物色に与えた影響として最も自然なのはどれか。","opts":["長期金利の低下は金利敏感なグロース株・ハイテク株の買い安心感につながり、実際に情報・通信や電子部品が買われた","長期金利が下がると必ず銀行株が最も買われる","金利低下は株式にとって常に売り材料である","金利は債券市場だけの話で株式の業種別物色には影響しない"],"correct":0,"explain":"割引率の低下は将来収益の現在価値を高めるため、成長株・高PER銘柄の追い風になります。逆に銀行や保険は利ざや拡大期待が後退しやすく、金利低下局面では相対的に劣後しがちです。この日は情報・通信業や電気機器が上位で、典型的な金利低下時の物色でした。","chart":{"type":"line","data":[{"label":"9/1","value":3},{"label":"9/2","value":2.99},{"label":"9/3","value":2.965},{"label":"9/4","value":2.9}]}},{"cat":"個別材料（決算ショック）","q":"2026年9月4日の米国市場では、ルルレモン・アスレティカが一時17%超、フェア・アイザック（FICO）が約16%下落するなど、個別材料での急落が目立った。指数が0.5%程度の下げにとどまる中で起きたこうした単独急落への短期トレードの対応として最も適切なのはどれか。","opts":["急落初日は板が薄く値幅も大きいため、指数のトレンドとは切り離し、寄り付き直後の乱高下を避けて需給が落ち着く水準・時間帯を待つ","二桁の下落は必ず行き過ぎなので寄り付きで全力ナンピン買いする","指数が下げていないのだから個別の急落はすぐ全戻しする","急落銘柄は上場廃止リスクが高いので永久に触ってはいけない"],"correct":0,"explain":"決算・ガイダンス起因のギャップダウンは、業績見通しという「ファンダメンタルの水準訂正」であり、単なる需給の行き過ぎとは異なります。初日はアルゴと投げが交錯して値幅が荒く、リスク管理が難しいため、短期でも出来高の減衰と価格帯の固まりを確認してから入るのが定石です。","chart":{"type":"bar","data":[{"label":"ルルレモン(%)","value":-17.35},{"label":"FICO(%)","value":-15.97},{"label":"NYダウ(%)","value":-0.5},{"label":"ナスダック総合(%)","value":-0.44}]}},{"cat":"歴史（コロナショック）","q":"2020年2〜3月の新型コロナウイルス・ショックにおける米国株の値動きとして、最も正しいのはどれか。","opts":["S&P500は2月の最高値から約1カ月で3割超下落したが、FRBの緊急利下げと無制限の量的緩和、政府の大規模財政出動を受けて3月下旬に底入れし、同年8月には最高値を更新した","下落は緩やかで、底入れまでに2年以上を要した","下落後は5年以上にわたり最高値を回復できなかった","中央銀行は何も対応せず、株価は自律的に回復した"],"correct":0,"explain":"S&P500は2020年2月19日の高値から3月23日の安値まで約34%下落し、これは史上最速級の弱気相場入りでした。一方で政策対応が極めて迅速だったため回復も急で、同年8月には最高値を更新。『暴落の深さより政策対応の速さが回復スピードを決める』という教訓を残した局面です。","chart":{"type":"line","data":[{"label":"2020/2/19高値","value":3386},{"label":"2020/3/23安値","value":2237},{"label":"2020/6末","value":3100},{"label":"2020/8/18","value":3389}]}},{"cat":"歴史（令和のブラックマンデー）","q":"2024年8月5日、日経平均株価 マクロ分析で知られます。『分散こそ投資における唯一のフリーランチ』という発想は、短期トレードでもポジションの相関を点検する視点として応用できます。","chart":{"type":"none","data":[]}}];

const MARKET = {"nikkei225":"65,020.94円","nikkei225Change":"+806.46 (+1.26%)","nikkeiLeverage":"約67,900円（概算）","nikkeiLeverageChange":"+約1,700円 (+約2.5%)　※日経平均の変動率の約2倍から試算した概算値","usdJpy":"156.23円","usdJpyChange":"-0.80円 (-0.50%／円高)","asOf":"2026年9月5日 早朝（日本時間）時点。日経平均は9月4日大引け（前営業日終値）、日経レバ(1570)は9月4日終値ベースの概算値。ドル円は9月5日5時50分頃のニューヨーク市場終盤の値。"};

let idx = 0, score = 0, answered = false;

function renderMarketBar(){
  const el = document.getElementById('marketBar');
  if(!MARKET){ el.style.display = 'none'; return; }
  const items = [
    {label:'日経平均', value: MARKET.nikkei225, change: MARKET.nikkei225Change},
    {label:'日経レバ(1570)', value: MARKET.nikkeiLeverage, change: MARKET.nikkeiLeverageChange},
    {label:'ドル円', value: MARKET.usdJpy, change: MARKET.usdJpyChange},
  ];
  const row = items.map(it=>{
    const c = (it.change || '').trim();
    const color = (c.startsWith('+') || c.startsWith('▲')) ? 'var(--up)' : (c.startsWith('-') || c.startsWith('▼')) ? 'var(--down)' : '#8a8270';
    return `<div class="market-item">
      <div class="market-label">${it.label}</div>
      <div class="market-value">${it.value}</div>
      ${c ? `<div class="market-change" style="color:${color}">${c}</div>` : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="market-row">${row}</div><div class="market-asof">${MARKET.asOf}</div>`;
}

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = QUESTIONS.map((_,i)=>`<div class="dot"><i style="width:${i<idx?100:(i===idx?0:0)}%"></i></div>`).join('');
}

function renderChart(chart){
  if(!chart || chart.type === 'none' || !chart.data || chart.data.length === 0) return '';
  const w = 440, h = 120, pad = 24;
  if(chart.type === 'bar'){
    const max = Math.max(...chart.data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - pad*2) / chart.data.length - 16;
    const zero = h/2;
    const bars = chart.data.map((d,i)=>{
      const x = pad + i*((w-pad*2)/chart.data.length) + 8;
      const barH = (Math.abs(d.value)/max) * (h/2 - 14);
      const y = d.value >= 0 ? zero - barH : zero;
      const color = d.value >= 0 ? 'var(--up)' : 'var(--down)';
      return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}" rx="2"/>
              <text x="${x+bw/2}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${d.label}</text>
              <text x="${x+bw/2}" y="${d.value>=0? y-4 : y+barH+11}" font-size="10" fill="#12213a" text-anchor="middle" font-weight="700">${d.value>0?'+':''}${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="${pad}" y1="${zero}" x2="${w-pad}" y2="${zero}" stroke="#d8d0bd"/>${bars}</svg>`;
  }
  if(chart.type === 'line'){
    const vals = chart.data.map(d=>d.value);
    const max = Math.max(...vals), min = Math.min(...vals);
    const step = (w - pad*2) / (chart.data.length - 1 || 1);
    const pts = chart.data.map((d,i)=>{
      const x = pad + i*step;
      const y = 14 + (1 - (d.value - min)/(max-min || 1)) * (h - 34);
      return {x,y,label:d.label,value:d.value};
    });
    const path = pts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--up)"/>
      <text x="${p.x}" y="${p.y-8}" font-size="9" fill="#12213a" text-anchor="middle" font-weight="700">${p.value.toLocaleString()}</text>
      <text x="${p.x}" y="${h-4}" font-size="9" fill="#5b543f" text-anchor="middle">${p.label}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><path d="${path}" fill="none" stroke="var(--up)" stroke-width="2"/>${dots}</svg>`;
  }
  return '';
}

function renderQuestion(){
  answered = false;
  renderProgress();
  const item = QUESTIONS[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">第${idx+1}問 / 全${QUESTIONS.length}問</div>
    <div class="question">${item.q}</div>
    <div id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">
      <h3>解説</h3>
      <p id="explainText"></p>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <button class="next" id="nextBtn">${idx===QUESTIONS.length-1?'結果を見る':'次の問題へ'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  document.querySelectorAll('.opt').forEach((btn,bi)=>{
    btn.disabled = true;
    if(bi === item.correct){
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-correct">○</span>');
    } else if(bi === i){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', '<span class="mark mark-wrong">✕</span>');
    }
  });
  if(i === item.correct) score++;
  document.getElementById('explainText').textContent = item.explain;
  document.getElementById('chartWrap').innerHTML = renderChart(item.chart);
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const dots = document.querySelectorAll('.dot i');
  dots[idx].style.width = '100%';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizArea').style.display = 'none';
    const result = document.getElementById('result');
    result.classList.add('show');
    document.getElementById('scoreText').textContent = score + ' / ' + QUESTIONS.length;
    const pct = score / QUESTIONS.length;
    let comment = "この調子で明日も続けましょう。";
    if(pct === 1) comment = "全問正解！今日の内容は完全に定着しています。";
    else if(pct >= 0.7) comment = "良いペースです。間違えた問題は明日以降も形を変えて出題されます。";
    else comment = "基礎から少しずつ。焦らず毎日の積み重ねが効きます。";
    document.getElementById('scoreComment').textContent = comment;
    if(NEWS.length > 0 || NEWS_JP.length > 0){
      document.getElementById('newsBtn').classList.add('show');
      document.getElementById('newsBtn').addEventListener('click', showNews);
    }
    return;
  }
  renderQuestion();
}

function renderNewsItems(list){
  return list.map(n => `
    <div class="news-item">
      <div class="news-src">${n.src}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-sum">${n.sum}</div>
      <a class="news-link" href="${n.url}" target="_blank" rel="noopener">記事を読む →</a>
    </div>
  `).join('');
}

function showNews(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('newsList').innerHTML = renderNewsItems(NEWS);
  const jpSection = document.getElementById('newsJpSection');
  if(NEWS_JP.length > 0){
    document.getElementById('newsListJp').innerHTML = renderNewsItems(NEWS_JP);
    jpSection.style.display = '';
  } else {
    jpSection.style.display = 'none';
  }
  document.getElementById('newsArea').classList.add('show');
}

renderMarketBar();
renderQuestion();
</script>
